/* Design tokens, reset, typography. Light and dark themes share one set of token names. */
:root {

  --glass: rgba(245, 246, 248, .82);
  --radius: 20px; --radius-sm: 12px;
  --glow: rgba(20, 184, 166, .11);
  --shadow-sm: 0 1px 2px rgba(15, 26, 25, .04), 0 1px 1px rgba(15, 26, 25, .03);
  --shadow-md: 0 10px 28px -10px rgba(15, 26, 25, .16);

  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
[data-theme="dark"] {
  --ink: #070d0c; --ink-2: #111b19;
  --paper: #0b1211; --card: #121c1b; --line: #1f2d2b; --line-strong: #2c3d3a;
  --text: #e9f0ee; --muted: #98a9a5;
  --brand: #2dd4bf; --on-brand: #062b26; --brand-soft: #123530;
  --bad: #f08468; --bad-soft: #3a211b;
  --warn: #e3b04b; --warn-soft: #352a12;
  --hero-from: #14625b; --hero-to: #0c2f2c; --hero-text: #e9f0ee;
  --glass: rgba(11, 18, 17, .82);
  --shadow-sm: none; --shadow-md: 0 10px 28px -10px rgba(0, 0, 0, .6);
  --glow: rgba(45, 212, 191, .10);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum' 1, 'cv11' 1, 'ss01' 1; }

:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

[hidden] { display: none !important; }

/* Ambient light behind the page: gives depth without decoration */
body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 560px; z-index: 0; pointer-events: none;
  background: radial-gradient(900px 380px at 78% -90px, var(--glow), transparent 70%), radial-gradient(620px 320px at 12% -70px, var(--glow), transparent 70%); }
.app { position: relative; z-index: 1; }

  <style>
/* Reusable UI parts: cards, KPIs, meters, buttons, forms, lists, tags, settings, toast. */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 22px; min-width: 0; transition: border-color .2s, box-shadow .2s; }
.card:hover { border-color: var(--line-strong); }
.card-head { margin-bottom: 16px; }
.card h2 { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.card-sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }

/* Controls */
.view-tools { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid transparent; font-weight: 700; transition: background .15s, border-color .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--brand); color: var(--on-brand); }

.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--card); transition: border-color .15s, background .15s; }
.icon-btn:hover { border-color: var(--muted); }

select:hover, input[type="text"]:hover { border-color: var(--muted); }

.view-tools select, .lang-select { width: auto; font-weight: 600; }

/* KPI cards */
.kpi { position: relative; padding: 20px 22px; overflow: hidden; }
.kpi:hover { box-shadow: var(--shadow-md); }
.kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.kpi-label { color: var(--muted); font-weight: 700; font-size: 13px; }
.kpi-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--brand); background: var(--brand-soft); }
.kpi-icon svg { width: 18px; height: 18px; }
.kpi-value { font-size: 30px; font-weight: 700; letter-spacing: -.035em; line-height: 1.2; margin: 12px 0 2px; font-variant-numeric: tabular-nums; }
.kpi-caption { color: var(--muted); font-size: 12.5px; }
.kpi-delta { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; padding: 3px 10px; border-radius: 99px; background: var(--paper); font-size: 12px; font-weight: 700; color: var(--muted); }
.kpi-delta.is-good { background: var(--brand-soft); color: var(--brand); }
.kpi-delta.is-bad { background: var(--bad-soft); color: var(--bad); }
.kpi-delta + .kpi-caption { margin-top: 10px; }
.kpi-hero { border: 0; color: var(--hero-text); background: radial-gradient(120% 140% at 100% 0%, rgba(94, 234, 212, .22), transparent 55%), linear-gradient(135deg, var(--hero-from), var(--hero-to)); box-shadow: var(--shadow-md); }
.kpi-hero .kpi-label, .kpi-hero .kpi-caption { color: rgba(255, 255, 255, .78); }
.kpi-hero .kpi-icon { background: rgba(255, 255, 255, .16); color: #fff; }
.kpi-hero .kpi-delta { background: rgba(255, 255, 255, .18); color: #fff; }

.chart-box { position: relative; height: 290px; }

/* Lists */
.row-list { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.row:first-child { padding-top: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 700; overflow-wrap: anywhere; }
.row-sub { color: var(--muted); font-size: 12.5px; }
.row-value { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row-end { text-align: right; display: grid; justify-items: end; gap: 4px; }

.empty-inline { color: var(--muted); padding: 18px 0; }

.empty-state { text-align: center; padding: 64px 24px; display: grid; gap: 12px; justify-items: center; border-style: dashed; border-color: var(--line-strong); box-shadow: none; }

.form { display: grid; gap: 16px; max-width: 460px; }
.field { display: grid; gap: 6px; font-weight: 700; font-size: 13px; }
.field input, .field select { font-weight: 500; }

.settings-block + .settings-block { border-top: 1px solid var(--line); padding-top: 24px; margin-top: 24px; }

@media (pointer: coarse) {

@media (max-width: 700px) {
  .settings-block { grid-template-columns: minmax(0, 1fr); }

}
@media (max-width: 640px) {
  .view-tools { justify-content: stretch; }
  .view-tools label, .view-tools select { width: 100%; }

}

/* Statements and tables (accounting-style: dense, ruled, totals emphasised) */
.table-wrap { overflow-x: auto; margin: 0 -8px; }

.hero::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1); }
.hero-main { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.hero-hello { font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, .72); }
.hero-label { margin-top: 18px; font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, .8); }
.hero-value { font-size: clamp(34px, 4.4vw, 52px); font-weight: 700; letter-spacing: -.045em; line-height: 1.1; margin: 4px 0 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero-note { margin-top: auto; padding-top: 14px; font-size: 12.5px; color: rgba(255, 255, 255, .66); }
.hero .kpi-delta { margin-top: 8px; background: rgba(255, 255, 255, .16); color: #fff; }
.hero .kpi-delta.is-bad { background: rgba(255, 140, 110, .28); }
.hero-side { display: flex; flex-direction: column; align-items: stretch; gap: 14px; min-width: 0; }
.hero .seg { align-self: flex-end; background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .14); }
.hero .seg button { color: rgba(255, 255, 255, .72); }
.hero .seg button.is-active { background: rgba(255, 255, 255, .2); color: #fff; box-shadow: none; }
.hero-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.hero .btn-ghost { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .18); color: #fff; }
.hero .btn-ghost:hover { background: rgba(255, 255, 255, .18); border-color: rgba(255, 255, 255, .3); }

.spark { display: block; width: 100%; height: 38px; margin-top: 14px; color: var(--brand); }
.spark .line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.spark .area { fill: currentColor; opacity: .1; }
.spark-hero { flex: 1; height: auto; min-height: 90px; margin: 0; color: #7ff3de; }

.stock-card .kpi-delta { align-self: flex-start; margin-top: 10px; }

.kpi .spark { margin-top: auto; padding-top: 0; }
.kpi .kpi-delta { align-self: flex-start; }

/* ---- Command palette and top-bar search ---- */
.search-btn { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--card); color: var(--muted); font-weight: 600; transition: border-color .15s; }

.search-btn svg { width: 17px; height: 17px; }

.palette { border: 0; padding: 0; width: min(560px, calc(100vw - 32px)); margin: 12vh auto auto; border-radius: 20px; background: var(--card); color: var(--text); box-shadow: 0 40px 90px -24px rgba(0, 0, 0, .55), 0 0 0 1px var(--line); overflow: hidden; }
.palette::backdrop { background: rgba(5, 10, 9, .55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.palette input { width: 100%; min-height: 58px; padding: 0 22px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; font-size: 16px; box-shadow: none; }

.palette li button svg { color: var(--brand); }

.palette li small { color: var(--muted); font-size: 12.5px; }
.palette-empty { padding: 22px; text-align: center; color: var(--muted); }

/* ---- Responsive rules for the modern dashboard (after the base rules so they win) ---- */
@media (max-width: 1180px) {
  .top-grid { grid-template-columns: minmax(0, 1fr); }

}

}

<script>
/* Shared helpers. Everything in the app hangs off one global namespace: BOS. */
window.BOS = window.BOS || {};
(function (B) {
  'use strict';
  const pad = n => String(n).padStart(2, '0');

  B.BUILD = '2026-11-19.2'; // shown in Settings so you can tell which copy of the app a device is running
  B.$ = (sel, root = document) => root.querySelector(sel);
  B.$$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  B.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  B.css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  B.uid = prefix => prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  const currency = () => (B.store && B.store.state && B.store.state.settings.currency) || 'USD';
  const loc = () => (B.i18n ? B.i18n.locale() : 'en-US');

  // All records are stored in US dollars. Choosing another currency converts every amount
  // with the rates in Settings (central-bank rates, Aug 2026, entered by hand).
  B.DEFAULT_RATES = { UZS: 11850, RUB: 84 };
  const rate = () => {
    const c = currency();
    if (c === 'USD') return 1;
    const saved = Number(((B.store.state.settings.rates) || {})[c]);
    return saved > 0 ? saved : B.DEFAULT_RATES[c] || 1;
  };
  const intl = (digits, extra) => new Intl.NumberFormat(loc(), { style: 'currency', currency: currency(), minimumFractionDigits: 0, maximumFractionDigits: digits, ...extra });
  const bigSum = v => currency() === 'UZS' && Math.abs(v) >= 1e9;

  B.fmt = {
    iso: d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
    today: () => B.fmt.iso(new Date()),
    rate,
    rate0: c => ((B.store.state.settings.rates || {})[c]) || B.DEFAULT_RATES[c],   // rate for a given code, for Settings
    conv: n => n * rate(),                          // stored USD -> chosen currency
    show: v => intl(currency() === 'UZS' ? 0 : 2).format(v),   // v is already in the chosen currency
    show0: v => (bigSum(v) ? intl(2, { notation: 'compact' }) : intl(0)).format(v),
    money: n => B.fmt.show(n * rate()),             // stored USD in, formatted chosen currency out
    money0: n => B.fmt.show0(n * rate()),
    compact: v => new Intl.NumberFormat(loc(), { style: 'currency', currency: currency(), notation: 'compact', maximumFractionDigits: 1 }).format(v),
    pct: n => `${n.toFixed(1)}%`,
    num: n => new Intl.NumberFormat(loc()).format(n),
    date: iso => new Date(iso + 'T00:00:00').toLocaleDateString(loc(), { month: 'short', day: 'numeric', year: 'numeric' }),
    month: d => d.toLocaleDateString(loc(), { month: 'short' })
  };
})(window.BOS);

</script>

<script>
/* Single source of truth. Modules read B.store.state and change it only through update(). */
(function (B) {
  'use strict';
  const KEY = 'businessos.v2';
  const listeners = new Set();

  B.store = {
    state: null,

    load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const saved = JSON.parse(raw);
          if (saved && saved.version === 1 && Array.isArray(saved.sales)) {
            if (!['USD', 'UZS', 'RUB'].includes(saved.settings.currency)) saved.settings.currency = 'USD';
            // Stage 1: the workspace holds only demo data, so a newer sample business can replace it
            // (settings are kept). Remove this once users can enter their own records.
            if (saved.demoVersion !== B.demo.VERSION) {
              const fresh = B.demo.generate();
              fresh.settings = { ...fresh.settings, ...saved.settings };
              this.state = fresh; this.save(); return;
            }
            this.state = saved; return;
          }
        }
      } catch (err) { /* corrupted data: fall back to demo data */ }
      this.state = B.demo.generate();
      this.save();
    },

    save() {
      try { localStorage.setItem(KEY, JSON.stringify(this.state)); }
      catch (err) { B.toast && B.toast(B.t('Storage is full or blocked. Changes will not be saved.')); }
    },

    // update(state => { ...mutate... }) saves and notifies every listener.
    update(mutator) { mutator(this.state); this.save(); listeners.forEach(fn => fn(this.state)); },
    reset() { const keep = this.state.settings; this.state = B.demo.generate(); this.state.settings = { ...this.state.settings, ...keep }; this.save(); listeners.forEach(fn => fn(this.state)); },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  };
})(window.BOS);

</script>
<script>
/* Financial formulas. Pure functions: state in, numbers out. No DOM here.
 *
 *  Revenue            = value of sales made in the period (paid or not)
 *  COGS               = quantity sold × purchase cost at time of sale
 *  Gross Profit       = Revenue − COGS
 *  Total Expenses     = COGS + operating expenses (rent, salaries, marketing, ...)
 *  Net Profit         = Revenue − Total Expenses  (= Gross Profit − operating expenses)
 *  Profit Margin      = Net Profit ÷ Revenue × 100
 *  Cash Flow          = actual cash received (paid sales) − actual cash paid out (paid expenses + paid stock purchases)
 *  Inventory Value    = quantity on hand × purchase price
 *
 * Revenue, profit and cash flow differ on purpose: an unpaid sale is revenue but not cash,
 * and a stock purchase is cash out but not an expense until the goods are sold (COGS).
 */
(function (B) {
  'use strict';
  const sum = (arr, fn) => arr.reduce((s, x) => s + fn(x), 0);
  const saleTotal = s => sum(s.items, i => i.qty * i.price);
  const saleCost = s => sum(s.items, i => i.qty * i.cost);
  const between = (d, from, to) => d >= from && d <= to;

  const F = {
    saleTotal, saleCost,

    // Current period of N months (calendar months incl. this one) and the equal period before it.
    range(months, now = new Date()) {
      const y = now.getFullYear(), m = now.getMonth(), iso = B.fmt.iso;
      return {
        from: iso(new Date(y, m - (months - 1), 1)), to: iso(now),
        prevFrom: iso(new Date(y, m - (2 * months - 1), 1)), prevTo: iso(new Date(y, m - (months - 1), 0))
      };
    },

    summary(st, from, to) {
      const sales = st.sales.filter(s => between(s.date, from, to));
      const expenses = st.expenses.filter(e => between(e.date, from, to));
      const buys = st.purchases.filter(p => between(p.date, from, to));

      const revenue = sum(sales, saleTotal);
      const cogs = sum(sales, saleCost);
      const opex = sum(expenses, e => e.amount);
      const totalExpenses = cogs + opex;
      const netProfit = revenue - totalExpenses;
      const cashIn = sum(sales.filter(s => s.status === 'paid'), saleTotal);
      const paidExpenses = sum(expenses.filter(e => e.paid), e => e.amount);
      const paidStock = sum(buys.filter(p => p.paid), p => p.qty * p.unitCost);
      const cashOut = paidExpenses + paidStock;

      return {
        revenue, cogs, grossProfit: revenue - cogs, opex, totalExpenses, netProfit,
        margin: revenue ? (netProfit / revenue) * 100 : 0,
        cashIn, cashOut, paidExpenses, paidStock, cashFlow: cashIn - cashOut,
        receivables: revenue - cashIn, salesCount: sales.length
      };
    },

    change: (cur, prev) => (prev === 0 ? null : ((cur - prev) / Math.abs(prev)) * 100),

    monthly(st, count = 12) {
      const now = new Date(), rows = [];
      for (let i = count - 1; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        rows.push({ label: B.fmt.month(d), ...F.summary(st, key + '-01', key + '-31') });
      }
      return rows;
    },

    inventoryValue: st => sum(st.products, p => p.qty * p.purchasePrice),
    lowStock: st => st.products.filter(p => p.qty <= p.reorderLevel).sort((a, b) => a.qty / a.reorderLevel - b.qty / b.reorderLevel),

    topProducts(st, from, to, limit = 5) {
      const map = {};
      st.sales.filter(s => between(s.date, from, to)).forEach(s => s.items.forEach(i => {
        const row = map[i.productId] || (map[i.productId] = { productId: i.productId, units: 0, revenue: 0 });
        row.units += i.qty; row.revenue += i.qty * i.price;
      }));
      return Object.values(map).sort((a, b) => b.units - a.units).slice(0, limit)
        .map(r => { const p = st.products.find(x => x.id === r.productId); return { ...r, name: p ? B.label(p) : 'Deleted product' }; });
    },

    costBreakdown(st, from, to) {
      const s = F.summary(st, from, to), map = { 'Cost of goods sold': s.cogs };
      st.expenses.filter(e => between(e.date, from, to)).forEach(e => { map[e.category] = (map[e.category] || 0) + e.amount; });
      return Object.entries(map).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    }
  };
  B.finance = F;
})(window.BOS);

</script>

    margin: '<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
    cash: '<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M21 13a8 8 0 1 1-10-10 6.5 6.5 0 0 0 10 10z"/>',
    settings: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'
  };
  B.icon = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;

  let timer;
  B.toast = message => {
    const el = B.$('#toast');
    el.textContent = message;
    el.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(() => el.classList.remove('is-visible'), 2600);
  };

  B.chartDefaults = () => {
    Chart.defaults.font.family = "'Manrope', system-ui, sans-serif";
    Chart.defaults.font.size = 12;

})(window.BOS);

</script>
<script>
/* Hash router + sidebar. A module is { id, title, sub, icon, group, render(root), destroy?() }. */
(function (B) {
  'use strict';
  const order = [];
  B.modules = {};
  B.register = mod => { B.modules[mod.id] = mod; order.push(mod.id); };

  // Hash names are plain "bos-<id>" (letters, digits, hyphen). Hosts such as published pages
  // only pass simple #names through, and some names (e.g. "settings") are reserved by them.
  const PREFIX = 'bos-';
  const idFromHash = () => { const h = location.hash.replace('#', ''); return h.indexOf(PREFIX) === 0 ? h.slice(PREFIX.length) : ''; };

  B.router = {
    current: null,

    buildNav() {
      let group = '';
      B.$('#nav').innerHTML = order.map(id => {
        const m = B.modules[id];
        const label = m.group !== group ? `<p class="nav-group">${B.t(m.group)}</p>` : '';
        group = m.group;
        return `${label}<a class="nav-item" href="#${PREFIX}${id}" data-id="${id}" title="${B.t(m.title)}">${B.icon(m.icon)}<span>${B.t(m.title)}</span></a>`;
      }).join('');
    },

    start() {
      this.buildNav();
      // Clicks switch the page directly; the hash is only kept in sync for back/forward and bookmarks.
      B.$('#nav').addEventListener('click', e => {
        const a = e.target.closest('a[data-id]');
        if (a) { e.preventDefault(); this.navigate(a.dataset.id); }
      });
      window.addEventListener('hashchange', () => this.go());
      B.store.subscribe(() => { this.buildNav(); this.show(this.current, true); });
      this.go();
    },

    navigate(id) {
      if (!B.modules[id]) return;
      if (B.modules[id] !== this.current) this.show(B.modules[id], false);
      try { if (idFromHash() !== id) location.hash = PREFIX + id; } catch (err) { /* hash not writable here: fine */ }
    },

    go() {
      const mod = B.modules[idFromHash()];
      if (mod) { if (mod !== this.current) this.show(mod, false); }
      else if (!this.current) this.show(B.modules[order[0]], false);
    },

    show(mod, isRefresh) {
      if (this.current && this.current.destroy) this.current.destroy();
      this.current = mod;
      B.$$('.nav-item').forEach(a => a.classList.toggle('is-active', a.dataset.id === mod.id));
      B.$('#pageTitle').textContent = B.t(mod.title);
      B.$('#pageSub').textContent = B.t(mod.sub);
      document.title = `${B.t(mod.title)} · Business OS`;
      const root = B.$('#view');
      root.innerHTML = '';
      root.classList.remove('enter');
      if (!isRefresh) { void root.offsetWidth; root.classList.add('enter'); }
      try { mod.render(root); }
      catch (err) {
        console.error(err);
        root.innerHTML = `<section class="card empty-state"><h2>Something went wrong</h2><p>${B.esc(err.message)}</p></section>`;
      }
      if (!isRefresh) { window.scrollTo({ top: 0 }); B.closeSidebar(); }
    }
  };

  B.openSidebar = () => { B.$('#sidebar').classList.add('is-open'); B.$('#scrim').classList.add('is-visible'); document.body.classList.add('nav-open'); };
  B.closeSidebar = () => { B.$('#sidebar').classList.remove('is-open'); B.$('#scrim').classList.remove('is-visible'); document.body.classList.remove('nav-open'); };
})(window.BOS);

</script>
<script>
/* Command palette (Ctrl/Cmd + K): jump to any page by typing. */
(function (B) {
  'use strict';
  let dlg, input, list, items = [], active = 0;

  function build() {
    dlg = document.createElement('dialog');
    dlg.className = 'palette';
    dlg.innerHTML = '<input type="text" id="palInput" autocomplete="off"><ul id="palList" role="listbox"></ul>';
    document.body.appendChild(dlg);
    input = B.$('#palInput', dlg); list = B.$('#palList', dlg);
    input.addEventListener('input', () => { active = 0; draw(); });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { active = Math.min(active + 1, items.length - 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); draw(); e.preventDefault(); }
      else if (e.key === 'Enter' && items[active]) go(items[active].id);
    });
    list.addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) go(b.dataset.id); });
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  }

  function go(id) { dlg.close(); B.router.navigate(id); }

  function draw() {
    const q = input.value.trim().toLowerCase();
    const inTitle = m => B.t(m.title).toLowerCase().includes(q);
    items = Object.keys(B.modules).map(id => B.modules[id])
      .filter(m => !q || (B.t(m.title) + ' ' + B.t(m.sub)).toLowerCase().includes(q))
      .sort((a, b) => Number(inTitle(b)) - Number(inTitle(a)));   // title matches first
    list.innerHTML = items.length
      ? items.map((m, i) => `<li><button type="button" role="option" data-id="${m.id}" class="${i === active ? 'is-active' : ''}">${B.icon(m.icon)}<span><b>${B.esc(B.t(m.title))}</b><small>${B.esc(B.t(m.sub))}</small></span></button></li>`).join('')
      : `<li class="palette-empty">${B.t('No results')}</li>`;
  }

  B.palette = {
    open() {
      if (!dlg) build();
      if (dlg.open) return;
      input.placeholder = B.t('Search pages…');
      input.value = ''; active = 0; draw();
      dlg.showModal();
      input.focus();
    }
  };
})(window.BOS);

</script>
<script>
/* Dashboard: revenue, profit and cash flow side by side, plus stock alerts and recent sales. */
(function (B) {
  'use strict';
  const { esc, fmt, t, finance: F } = B;
  const PALETTE = ['#0f766e', '#d9573b', '#3b4bd8', '#e0a526', '#7a5af8', '#2ba3c4', '#8a9490'];
  let charts = [];
  let months = 3;

  const delta = (pct, extra = '') => pct === null
    ? `<p class="kpi-delta">${t('No earlier period to compare')}</p>`
    : `<p class="kpi-delta ${pct >= 0 ? 'is-good' : 'is-bad'}">${pct >= 0 ? '▲' : '▼'} ${t('{p}% vs previous period', { p: Math.abs(pct).toFixed(1) })}</p>${extra}`;

  // Smooth SVG sparkline (no chart library needed, so it always renders)
  function spark(values, cls = '') {
    const w = 120, h = 40, n = values.length;
    const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
    const pts = values.map((v, i) => [(i / (n - 1)) * w, h - 5 - ((v - min) / span) * (h - 10)]);
    let line = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < n; i++) { const cx = (pts[i - 1][0] + pts[i][0]) / 2; line += ` C${cx},${pts[i - 1][1]} ${cx},${pts[i][1]} ${pts[i][0]},${pts[i][1]}`; }
    return `<svg class="spark ${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="area" d="${line} L${w},${h} L0,${h} Z"/><path class="line" d="${line}"/></svg>`;
  }

  // Numbers count up when a page opens (skipped when the user prefers reduced motion)
  function animateNumbers(root) {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    B.$$('[data-count]', root).forEach(el => {
      const end = Number(el.dataset.count), format = el.dataset.fmt === 'pct' ? fmt.pct : fmt.money0, t0 = performance.now();
      const tick = now => {
        const k = Math.min(1, (now - t0) / 800);
        el.textContent = format(end * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  const kpi = ({ label, caption, value, count, kind = 'money0', delta: footer, icon, series }) =>
    `<article class="card kpi"><div class="kpi-top"><p class="kpi-label">${t(label)}</p><span class="kpi-icon">${B.icon(icon)}</span></div>
      <p class="kpi-value" data-count="${count}" data-fmt="${kind}">${value}</p><p class="kpi-caption">${t(caption)}</p>${footer}${spark(series)}</article>`;
  const initials = name => name.split(/\s+/).filter(w => /^\p{L}/u.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase();

  const stockRow = p => {
    const pct = Math.min(100, Math.round((p.qty / p.reorderLevel) * 100)), bad = p.qty === 0 || pct < 40;
    return `<li class="row"><div class="row-main"><p class="row-title">${esc(B.label(p))}</p>
      <div class="meter ${bad ? 'is-bad' : 'is-warn'}"><i style="width:${pct}%"></i></div>
      <p class="row-sub">${t('{q} left · reorder at {r}', { q: fmt.num(p.qty), r: fmt.num(p.reorderLevel) })}</p></div>
      <span class="tag ${bad ? 'tag-bad' : 'tag-warn'}">${t(p.qty === 0 ? 'Out of stock' : 'Low stock')}</span></li>`;
  };

  function render(root) {
    const st = B.store.state, r = F.range(months);
    const cur = F.summary(st, r.from, r.to), prev = F.summary(st, r.prevFrom, r.prevTo);
    const low = F.lowStock(st), top = F.topProducts(st, r.from, r.to, 5);
    const recent = [...st.sales].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, 5);
    const customer = id => { const c = st.customers.find(x => x.id === id); return c ? B.label(c) : t('Unknown customer'); };
    const marginDiff = prev.revenue ? cur.margin - prev.margin : null;

    // Profit and loss statement rows (amounts in stored USD; formatted on output)
    const byCategory = (from, to) => { const m = {}; st.expenses.filter(e => e.date >= from && e.date <= to).forEach(e => { m[e.category] = (m[e.category] || 0) + e.amount; }); return m; };
    const oc = byCategory(r.from, r.to), op = byCategory(r.prevFrom, r.prevTo);
    const cats = [...new Set([...Object.keys(oc), ...Object.keys(op)])].sort((a, b) => (oc[b] || 0) - (oc[a] || 0));
    const plRows = [
      ['Revenue', cur.revenue, prev.revenue, ''], ['Cost of goods sold', cur.cogs, prev.cogs, ''],
      ['Gross profit', cur.grossProfit, prev.grossProfit, 'subtotal'],
      ...cats.map(c => [c, oc[c] || 0, op[c] || 0, 'indent']),
      ['Total operating expenses', cur.opex, prev.opex, 'subtotal'], ['Net profit', cur.netProfit, prev.netProfit, 'total']
    ];
    const change = (c, p) => { const v = F.change(c, p); return v === null ? '—' : `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}%`; };
    const plBody = plRows.map(([label, c, p, cls]) => `<tr class="${cls}"><td>${esc(t(label))}</td><td class="num">${fmt.money0(c)}</td><td class="num muted">${fmt.money0(p)}</td><td class="num muted">${change(c, p)}</td></tr>`).join('')
      + `<tr><td>${t('Profit Margin')}</td><td class="num">${fmt.pct(cur.margin)}</td><td class="num muted">${fmt.pct(prev.margin)}</td><td class="num muted">${marginDiff === null ? '—' : `${marginDiff >= 0 ? '+' : '−'}${Math.abs(marginDiff).toFixed(1)} ${t('pts')}`}</td></tr>`;
    const out = v => `−${fmt.money0(v)}`;

    const marginFooter = marginDiff === null ? delta(null)
      : `<p class="kpi-delta ${marginDiff >= 0 ? 'is-good' : 'is-bad'}">${marginDiff >= 0 ? '▲' : '▼'} ${t('{p} pts vs previous period', { p: Math.abs(marginDiff).toFixed(1) })}</p>`;
    const months12 = F.monthly(st, 12);
    const hour = new Date().getHours();
    const greeting = t(hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening');
    const firstName = (st.settings.ownerName || '').trim().split(/\s+/).pop();
    const periodLabel = t({ 1: 'This month', 3: 'Last 3 months', 6: 'Last 6 months', 12: 'Last 12 months' }[months]);
    const healthy = st.products.length ? Math.round(((st.products.length - low.length) / st.products.length) * 100) : 100;

    root.innerHTML = `
      <section class="top-grid">
        <article class="hero">
          <div class="hero-main">
            <p class="hero-hello">${esc(greeting)}${firstName ? ', ' + esc(firstName) : ''}</p>
            <p class="hero-label">${t('Net Profit')} · ${periodLabel}</p>
            <p class="hero-value" data-count="${cur.netProfit}" data-fmt="money0">${fmt.money0(cur.netProfit)}</p>
            ${delta(F.change(cur.netProfit, prev.netProfit))}
            <p class="hero-note">${t('Revenue − all expenses, incl. goods sold')}</p>
          </div>
          <div class="hero-side">
            <div class="seg" role="group" aria-label="${t('Reporting period')}">
              ${[1, 3, 6, 12].map(m => `<button type="button" data-months="${m}" class="${m === months ? 'is-active' : ''}">${t(m + 'M')}</button>`).join('')}
            </div>
            ${spark(months12.map(r => r.netProfit), 'spark-hero')}
            <div class="hero-actions">
              <button class="btn btn-ghost" id="exportBtn" type="button">${t('Export CSV')}</button>
              <button class="btn btn-ghost" id="printBtn" type="button">${t('Print')}</button>
            </div>
          </div>
        </article>
        <article class="card kpi stock-card">
          <div class="kpi-top"><p class="kpi-label">${t('Inventory Value')}</p><span class="kpi-icon">${B.icon('inventory')}</span></div>
          <p class="kpi-value" data-count="${F.inventoryValue(st)}" data-fmt="money0">${fmt.money0(F.inventoryValue(st))}</p>
          <p class="kpi-caption">${t('Quantity × purchase price, today')}</p>
          <div class="meter ${healthy < 70 ? 'is-warn' : ''}"><i style="width:${healthy}%"></i></div>
          <p class="kpi-delta ${low.length ? 'is-bad' : 'is-good'}">${low.length ? t('Needs restocking: {n}', { n: low.length }) : t('All stock above reorder level')}</p>
        </article>
      </section>

      <section class="grid-kpi4" aria-label="${t('Key figures')}">
        ${kpi({ label: 'Total Revenue', caption: 'Sales made, paid or not', value: fmt.money0(cur.revenue), count: cur.revenue, delta: delta(F.change(cur.revenue, prev.revenue)), icon: 'revenue', series: months12.map(r => r.revenue) })}
        ${kpi({ label: 'Gross Profit', caption: 'Revenue − cost of goods sold', value: fmt.money0(cur.grossProfit), count: cur.grossProfit, delta: delta(F.change(cur.grossProfit, prev.grossProfit)), icon: 'gross', series: months12.map(r => r.grossProfit) })}
        ${kpi({ label: 'Profit Margin', caption: 'Net profit ÷ revenue', value: fmt.pct(cur.margin), count: cur.margin, kind: 'pct', delta: marginFooter, icon: 'margin', series: months12.map(r => r.margin) })}
        ${kpi({ label: 'Cash Flow', caption: 'Cash received − cash paid out', value: fmt.money0(cur.cashFlow), count: cur.cashFlow, delta: delta(F.change(cur.cashFlow, prev.cashFlow)), icon: 'cash', series: months12.map(r => r.cashFlow) })}
      </section>

      <section class="grid-main">
        <article class="card">
          <div class="card-head"><h2>${t('Revenue, Expenses and Net Profit')}</h2><p class="card-sub">${t('By month, last 12 months')}</p></div>
          <div class="chart-box"><canvas id="trendChart" role="img" aria-label="${t('Revenue, Expenses and Net Profit')}"></canvas></div>
        </article>
        <article class="card">
          <div class="card-head"><h2>${t('Where the money goes')}</h2><p class="card-sub">${t('Total expenses in the period')}</p></div>
          <div class="chart-box"><canvas id="costChart" role="img" aria-label="${t('Where the money goes')}"></canvas></div>
        </article>
      </section>

      <section class="grid-three">
        <article class="card">
          <div class="card-head"><h2>${t('Restock soon')}</h2><p class="card-sub">${t('At or below reorder level')}</p></div>
          ${low.length ? `<ul class="row-list">${low.slice(0, 5).map(stockRow).join('')}</ul>${low.length > 5 ? `<p class="row-sub">${t('+{n} more', { n: low.length - 5 })}</p>` : ''}`
            : `<p class="empty-inline">${t('Nothing to restock. Every product is above its reorder level.')}</p>`}
        </article>
        <article class="card">
          <div class="card-head"><h2>${t('Fastest selling')}</h2><p class="card-sub">${t('Units sold in the period')}</p></div>
          ${top.length ? `<ul class="row-list">${top.map((p, i) => `<li class="row"><span class="rank">${i + 1}</span><div class="row-main"><p class="row-title">${esc(p.name)}</p>
              <div class="meter"><i style="width:${Math.round((p.units / top[0].units) * 100)}%"></i></div><p class="row-sub">${t('{n} units', { n: fmt.num(p.units) })}</p></div><p class="row-value">${fmt.money0(p.revenue)}</p></li>`).join('')}</ul>`
            : `<p class="empty-inline">${t('No sales in this period yet.')}</p>`}
        </article>
        <article class="card">
          <div class="card-head"><h2>${t('Recent sales')}</h2><p class="card-sub">${t('Latest five orders')}</p></div>
          ${recent.length ? `<ul class="row-list">${recent.map(s => `<li class="row"><span class="avatar-sm">${esc(initials(customer(s.customerId)))}</span><div class="row-main"><p class="row-title">${esc(customer(s.customerId))}</p><p class="row-sub">${s.id} · ${fmt.date(s.date)}</p></div>
              <div class="row-end"><p class="row-value">${fmt.money0(F.saleTotal(s))}</p><span class="tag ${s.status === 'paid' ? 'tag-good' : 'tag-warn'}">${t(s.status === 'paid' ? 'Paid' : 'Unpaid')}</span></div></li>`).join('')}</ul>`
            : `<p class="empty-inline">${t('No sales recorded yet.')}</p>`}
        </article>
      </section>

      <section class="grid-main">
        <article class="card">
          <div class="card-head"><h2>${t('Profit and loss')}</h2><p class="card-sub">${t('Financial statements')}</p></div>
          <div class="table-wrap"><table class="statement">
            <thead><tr><th>${t('Item')}</th><th class="num">${t('Current period')}</th><th class="num">${t('Previous period')}</th><th class="num">${t('Change')}</th></tr></thead>
            <tbody>${plBody}</tbody>
          </table></div>
        </article>
        <article class="card">
          <div class="card-head"><h2>${t('Cash flow statement')}</h2><p class="card-sub">${t('Current period')}</p></div>
          <div class="table-wrap"><table class="statement">
            <thead><tr><th>${t('Item')}</th><th class="num">${t('Amount')}</th></tr></thead>
            <tbody>
              <tr><td>${t('Cash received from customers')}</td><td class="num">${fmt.money0(cur.cashIn)}</td></tr>
              <tr><td>${t('Paid for expenses')}</td><td class="num">${out(cur.paidExpenses)}</td></tr>
              <tr><td>${t('Paid to suppliers for stock')}</td><td class="num">${out(cur.paidStock)}</td></tr>
              <tr class="total"><td>${t('Net cash flow')}</td><td class="num">${fmt.money0(cur.cashFlow)}</td></tr>
              <tr><td class="muted">${t('Not yet collected from customers')}</td><td class="num muted">${fmt.money0(cur.receivables)}</td></tr>
            </tbody>
          </table></div>
          <p class="note">${t('Revenue counts a sale when it is made, profit subtracts every cost, cash flow counts only money that actually moved.')}</p>
        </article>
      </section>`;

    B.$('#printBtn').addEventListener('click', () => window.print());
    B.$('#exportBtn').addEventListener('click', () => exportCSV(plRows));
    B.$$('.seg button[data-months]').forEach(btn => btn.addEventListener('click', () => { months = Number(btn.dataset.months); B.router.show(mod, true); }));
    animateNumbers(root);
    drawCharts(st, F.costBreakdown(st, r.from, r.to));
  }

  // Export the profit and loss table (amounts in the chosen currency, UTF-8 with BOM so Excel reads any language).
  function exportCSV(rows) {
    const cell = v => `"${String(v).replace(/"/g, '""')}"`;
    const data = [[t('Item'), t('Current period'), t('Previous period')],
      ...rows.map(([label, c, p]) => [t(label), Math.round(fmt.conv(c) * 100) / 100, Math.round(fmt.conv(p) * 100) / 100])];
    const blob = new Blob(['\ufeff' + data.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'business-os-profit-and-loss.csv' });
    a.click();
    URL.revokeObjectURL(a.href);
    B.toast(t('CSV exported'));
  }

  // Draws the total inside the doughnut hole
  const centerText = {
    id: 'centerText',
    afterDraw(chart, args, opts) {
      if (!opts || !opts.enabled) return;
      const { ctx, chartArea: a } = chart, x = (a.left + a.right) / 2, y = (a.top + a.bottom) / 2;
      ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = B.css('--muted'); ctx.font = "600 11px 'Inter', system-ui, sans-serif"; ctx.fillText(opts.label, x, y - 12);
      ctx.fillStyle = B.css('--text'); ctx.font = "700 17px 'Inter', system-ui, sans-serif"; ctx.fillText(opts.value, x, y + 8);
      ctx.restore();
    }
  };

  function drawCharts(st, costs) {
    if (typeof Chart === 'undefined') {   // CDN blocked or offline: keep the rest of the dashboard usable
      B.$$('.chart-box').forEach(b => { b.innerHTML = `<p class="empty-inline">${t('Charts could not load. Check your internet connection.')}</p>`; });
      return;
    }
    B.chartDefaults();
    const rows = F.monthly(st, 12);
    const fade = hex => ctx => {
      const a = ctx.chart.chartArea;
      if (!a) return hex + '22';
      const g = ctx.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
      g.addColorStop(0, hex + '30'); g.addColorStop(1, hex + '00');
      return g;
    };
    const tooltip = { backgroundColor: '#10201e', padding: 10, cornerRadius: 8, callbacks: { label: c => ` ${c.dataset.label || c.label}: ${fmt.show0(c.parsed.y !== undefined ? c.parsed.y : c.parsed)}` } };

    charts.push(new Chart(B.$('#trendChart'), {
      data: {
        labels: rows.map(r => r.label),
        datasets: [
          { type: 'bar', label: t('Net profit'), data: rows.map(r => fmt.conv(r.netProfit)), backgroundColor: rows.map(r => (r.netProfit >= 0 ? B.css('--brand') : B.css('--bad'))), borderRadius: 5, maxBarThickness: 22, order: 2 },
          { type: 'line', label: t('Revenue'), data: rows.map(r => fmt.conv(r.revenue)), borderColor: '#4f5df0', backgroundColor: fade('#4f5df0'), fill: true, tension: .35, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2.5, order: 1 },
          { type: 'line', label: t('Total expenses'), data: rows.map(r => fmt.conv(r.totalExpenses)), borderColor: '#e0a526', tension: .35, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2.5, order: 1 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { align: 'end', labels: { usePointStyle: true, boxWidth: 8, boxHeight: 8 } }, tooltip },
        scales: { x: { grid: { display: false }, border: { display: false } }, y: { border: { display: false }, grid: { color: B.css('--line') }, ticks: { callback: v => fmt.compact(v), maxTicksLimit: 6 } } }
      }
    }));

    const top = costs.slice(0, 6).map(([name, v]) => [t(name), v]);
    const rest = costs.slice(6).reduce((s, [, v]) => s + v, 0);
    if (rest > 0) top.push([t('Other'), rest]);
    charts.push(new Chart(B.$('#costChart'), {
      type: 'doughnut', plugins: [centerText],
      data: { labels: top.length ? top.map(c => c[0]) : [t('No expenses')], datasets: [{ data: top.length ? top.map(c => fmt.conv(c[1])) : [1], backgroundColor: top.length ? PALETTE : [B.css('--line')], borderWidth: 2, borderColor: B.css('--card') }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { centerText: { label: t('Total expenses'), value: fmt.show0(top.reduce((sum, c) => sum + fmt.conv(c[1]), 0)), enabled: costs.length > 0 }, legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, boxHeight: 8, padding: 10 } }, tooltip } }
    }));
  }

  const mod = {
    id: 'dashboard', title: 'Dashboard', sub: 'Your business at a glance', icon: 'dashboard', group: 'Overview',
    render, destroy() { charts.forEach(c => c.destroy()); charts = []; }
  };
  B.register(mod);
})(window.BOS);

</script>

<script>
/* Settings (Stage 1 subset): profile, currency, language, theme, demo data. */
(function (B) {
  'use strict';
  const { t } = B;
  const CURRENCIES = [['USD', 'US dollar ($)'], ['UZS', 'Uzbek sum (UZS)'], ['RUB', 'Russian ruble (RUB)']];
  const option = (value, label, current) => `<option value="${value}" ${value === current ? 'selected' : ''}>${B.esc(label)}</option>`;

  function render(root) {
    const s = B.store.state.settings, lang = B.i18n.lang();
    root.innerHTML = `<section class="card">
      <div class="settings-block">
        <h2>${t('Business profile')}</h2>
        <div class="form">
          <label class="field">${t('Your name')}
            <input type="text" id="ownerInput" maxlength="40" value="${B.esc(s.ownerName || 'Zokirov Abror')}">
            <span class="error" id="ownerError"></span>
          </label>
          <label class="field">${t('Business name')}
            <input type="text" id="bizInput" maxlength="40" value="${B.esc(s.businessName)}">
            <span class="error" id="bizError"></span>
          </label>
        </div>
      </div>
      <div class="settings-block">
        <h2>${t('Language')}</h2>
        <div class="form"><label class="field">${t('Interface language')}
          <select id="langSetting">${B.i18n.LANGS.map(([c, n]) => option(c, n, lang)).join('')}</select></label></div>
      </div>
      <div class="settings-block">
        <h2>${t('Currency')}</h2>
        <div class="form"><label class="field">${t('Display currency')}
          <select id="currencySelect">${CURRENCIES.map(([c, l]) => option(c, t(l), s.currency)).join('')}</select>
          <small>${t('All amounts are converted using the exchange rates below.')}</small></label></div>
      </div>
      <div class="settings-block">
        <h2>${t('Exchange rates')}</h2>
        <div class="form">
          ${['UZS', 'RUB'].map(c => `<label class="field">${t(c + ' per 1 USD')}
            <input type="text" inputmode="decimal" id="rate${c}" value="${B.fmt.rate0(c)}"><span class="error" id="rate${c}Error"></span></label>`).join('')}
          <small class="note">${t('Amounts are stored in US dollars and converted with these rates. Enter them by hand; they do not update automatically.')}</small>
          <div><button class="btn btn-ghost" id="ratesReset" type="button">${t('Reset to default rates')}</button></div>
        </div>
      </div>
      <div class="settings-block">
        <h2>${t('Theme')}</h2>
        <div class="seg" role="group" aria-label="${t('Theme')}">
          <button data-theme="light" class="${s.theme === 'light' ? 'is-active' : ''}">${t('Light')}</button>
          <button data-theme="dark" class="${s.theme === 'dark' ? 'is-active' : ''}">${t('Dark')}</button>
        </div>
      </div>
      <div class="settings-block">
        <h2>${t('Demo data')}</h2>
        <p class="card-sub">${t('Replace everything in this workspace with the original sample business.')}</p>
        <div><button class="btn btn-danger" id="resetBtn">${t('Reset demo data')}</button></div>
        <p class="card-sub">Business OS · Stage 1 · build ${B.BUILD} · demo data v${B.demo.VERSION}</p>
      </div>
    </section>`;

    const saveName = (inputId, errId, field, errMsg, doneMsg) => B.$(inputId).addEventListener('change', e => {
      const value = e.target.value.trim();
      if (!value) { B.$(errId).textContent = t(errMsg); return; }
      B.store.update(st => { st.settings[field] = value; });
      B.toast(t(doneMsg));
    });
    saveName('#ownerInput', '#ownerError', 'ownerName', 'Enter your name.', 'Name saved');
    saveName('#bizInput', '#bizError', 'businessName', 'Enter a business name.', 'Business name saved');

    ['UZS', 'RUB'].forEach(c => B.$('#rate' + c).addEventListener('change', e => {
      const v = parseFloat(String(e.target.value).replace(/\s/g, '').replace(',', '.'));
      if (!Number.isFinite(v) || v <= 0 || v > 1e7) { B.$('#rate' + c + 'Error').textContent = t('Enter a number greater than 0.'); return; }
      B.store.update(s => { s.settings.rates = { ...(s.settings.rates || {}), [c]: v }; });
      B.toast(t('Rate saved'));
    }));
    B.$('#ratesReset').addEventListener('click', () => { B.store.update(s => { s.settings.rates = { ...B.DEFAULT_RATES }; }); B.toast(t('Rates reset')); });
    B.$('#langSetting').addEventListener('change', e => B.store.update(st => { st.settings.language = e.target.value; }));
    B.$('#currencySelect').addEventListener('change', e => { B.store.update(st => { st.settings.currency = e.target.value; }); B.toast(t('Currency updated')); });
    B.$$('.seg button').forEach(b => b.addEventListener('click', () => B.store.update(st => { st.settings.theme = b.dataset.theme; })));
    B.$('#resetBtn').addEventListener('click', () => {
      if (confirm(t('Replace all data with the demo data?'))) { B.store.reset(); B.toast(t('Demo data restored')); }
    });
  }

  B.register({ id: 'settings', title: 'Settings', sub: 'Workspace preferences', icon: 'settings', group: 'System', render });
})(window.BOS);

</script>
<script>
/* Bootstrap: load data, keep the shell (theme, language, account) in sync with settings, start the router. */
(function (B) {
  'use strict';
  function syncShell() {
    const s = B.store.state.settings, lang = B.i18n.lang();
    const owner = s.ownerName || 'Zokirov Abror';
    document.documentElement.lang = lang;
    document.documentElement.dataset.theme = s.theme;
    B.$('#bizName').textContent = owner;
    B.$('#bizAvatar').textContent = owner.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    B.$('#bizMeta').textContent = B.t('Demo workspace');
    B.$('#menuBtn').setAttribute('aria-label', B.t('Open navigation'));
    document.querySelector('.app').classList.toggle('is-collapsed', s.sidebar === 'collapsed');
    B.$('#collapseBtn').innerHTML = B.icon('chevrons');
    B.$('#collapseBtn').setAttribute('aria-label', B.t('Collapse menu'));
    B.$('#searchBtn').innerHTML = `${B.icon('search')}<span>${B.t('Search')}</span><kbd>Ctrl K</kbd>`;
    B.$('#searchBtn').setAttribute('aria-label', B.t('Search pages…'));
    B.$('#statusRate').textContent = s.currency === 'USD' ? B.t('Amounts are in US dollars (base currency)') : B.t('1 USD = {r}', { r: `${B.fmt.num(B.fmt.rate())} ${s.currency}` });
    B.$('#statusBuild').textContent = `Business OS · ${B.BUILD}`;
    const themeBtn = B.$('#themeBtn');
    themeBtn.innerHTML = B.icon(s.theme === 'dark' ? 'sun' : 'moon');
    themeBtn.setAttribute('aria-label', `${B.t('Theme')}: ${B.t(s.theme === 'dark' ? 'Dark' : 'Light')}`);
    const sel = B.$('#langSelect');
    sel.setAttribute('aria-label', B.t('Language'));
    sel.innerHTML = B.i18n.LANGS.map(([c, n]) => `<option value="${c}" ${c === lang ? 'selected' : ''}>${n}</option>`).join('');
  }

  // If anything crashes before the first page is drawn, say so on screen instead of showing nothing.
  window.addEventListener('error', e => {
    const v = document.getElementById('view');
    if (v && v.firstElementChild && v.firstElementChild.id === 'boot') {
      v.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'empty-inline';
      p.textContent = 'Something went wrong: ' + (e.message || 'unknown error');
      v.appendChild(p);
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    B.store.load();
    syncShell();
    B.store.subscribe(syncShell);
    B.$('#langSelect').addEventListener('change', e => B.store.update(st => { st.settings.language = e.target.value; }));
    B.$('#themeBtn').addEventListener('click', () => B.store.update(st => { st.settings.theme = st.settings.theme === 'dark' ? 'light' : 'dark'; }));
    B.$('#collapseBtn').addEventListener('click', () => B.store.update(st => { st.settings.sidebar = st.settings.sidebar === 'collapsed' ? 'expanded' : 'collapsed'; }));
    B.$('#searchBtn').addEventListener('click', () => B.palette.open());
    document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); B.palette.open(); } });
    B.$('#menuBtn').addEventListener('click', B.openSidebar);
    B.$('#scrim').addEventListener('click', B.closeSidebar);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') B.closeSidebar(); });
    B.router.start();
  });
})(window.BOS);

</script>
