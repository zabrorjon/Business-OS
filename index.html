/* Design tokens, reset, typography. Light and dark themes share one set of token names. */
:root {
  --ink: #0d1716; --ink-2: #16231f; --ink-text: #a9b8b4;
  --paper: #f5f6f8; --card: #ffffff; --line: #e6e8ec; --line-strong: #d3d8de;

  --glow: rgba(20, 184, 166, .11);

  --shadow-md: 0 10px 28px -10px rgba(15, 26, 25, .16);

  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
[data-theme="dark"] {
  --ink: #070d0c; --ink-2: #111b19;
  --paper: #0b1211; --card: #121c1b; --line: #1f2d2b; --line-strong: #2c3d3a;
  --text: #e9f0ee; --muted: #98a9a5;
  --brand: #2dd4bf; --on-brand: #062b26; --brand-soft: #123530;
  --bad: #f08468; --bad-soft: #3a211b;
  --warn: #e3b04b; --warn-soft: #352a12;
  --hero-from: #14625b; --hero-to: #0c2f2c; --hero-text: #e9f0ee;
  --glass: rgba(11, 18, 17, .82);
  --shadow-sm: none; --shadow-md: 0 10px 28px -10px rgba(0, 0, 0, .6);
  --glow: rgba(45, 212, 191, .10);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum' 1, 'cv11' 1, 'ss01' 1; }

a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  background: radial-gradient(900px 380px at 78% -90px, var(--glow), transparent 70%), radial-gradient(620px 320px at 12% -70px, var(--glow), transparent 70%); }

  <style>
/* Reusable UI parts: cards, KPIs, meters, buttons, forms, lists, tags, settings, toast. */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 22px; min-width: 0; transition: border-color .2s, box-shadow .2s; }

.card-head { margin-bottom: 16px; }
.card h2 { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.card-sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }

/* Controls */
.view-tools { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid transparent; font-weight: 700; transition: background .15s, border-color .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--brand); color: var(--on-brand); }
.btn-ghost { background: var(--card); border-color: var(--line-strong); }
.btn-ghost:hover { border-color: var(--muted); }

.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--card); transition: border-color .15s, background .15s; }
.icon-btn:hover { border-color: var(--muted); }
select, input[type="text"], input[type="email"], input[type="number"], input[type="date"], input[type="search"], input[type="tel"] { width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--card); transition: border-color .15s, box-shadow .15s; }
select:hover, input[type="text"]:hover, input[type="email"]:hover, input[type="number"]:hover, input[type="date"]:hover, input[type="search"]:hover, input[type="tel"]:hover { border-color: var(--muted); }
select:focus, input[type="text"]:focus, input[type="email"]:focus, input[type="number"]:focus, input[type="date"]:focus, input[type="search"]:focus, input[type="tel"]:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.view-tools select, .lang-select { width: auto; font-weight: 600; }

/* KPI cards */
.kpi { position: relative; padding: 20px 22px; overflow: hidden; }
.kpi:hover { box-shadow: var(--shadow-md); }
.kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.kpi-label { color: var(--muted); font-weight: 700; font-size: 13px; }
.kpi-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--brand); background: var(--brand-soft); }
.kpi-icon svg { width: 18px; height: 18px; }
.kpi-value { font-size: 30px; font-weight: 700; letter-spacing: -.035em; line-height: 1.2; margin: 12px 0 2px; font-variant-numeric: tabular-nums; }
.kpi-caption { color: var(--muted); font-size: 12.5px; }
.kpi-delta { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; padding: 3px 10px; border-radius: 99px; background: var(--paper); font-size: 12px; font-weight: 700; color: var(--muted); }
.kpi-delta.is-good { background: var(--brand-soft); color: var(--brand); }
.kpi-delta.is-bad { background: var(--bad-soft); color: var(--bad); }
.kpi-delta + .kpi-caption { margin-top: 10px; }
.kpi-hero { border: 0; color: var(--hero-text); background: radial-gradient(120% 140% at 100% 0%, rgba(94, 234, 212, .22), transparent 55%), linear-gradient(135deg, var(--hero-from), var(--hero-to)); box-shadow: var(--shadow-md); }
.kpi-hero .kpi-label, .kpi-hero .kpi-caption { color: rgba(255, 255, 255, .78); }

.kpi-hero .kpi-delta { background: rgba(255, 255, 255, .18); color: #fff; }

.chart-box { position: relative; height: 290px; }

/* Lists */
.row-list { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; padding-bottom: 0; }

.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 700; overflow-wrap: anywhere; }
.row-sub { color: var(--muted); font-size: 12.5px; }

.meter.is-warn i { background: #d99a2b; }

.tag { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--paper); font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }

.empty-inline { color: var(--muted); padding: 18px 0; }
#boot { height: 120px; margin: 0; border-radius: var(--radius); color: transparent; background: linear-gradient(100deg, var(--line) 30%, var(--card) 50%, var(--line) 70%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; }
.empty-state { text-align: center; padding: 64px 24px; display: grid; gap: 12px; justify-items: center; border-style: dashed; border-color: var(--line-strong); box-shadow: none; }

.form { display: grid; gap: 16px; max-width: 460px; }

.seg button { min-height: 34px; border: 0; background: none; padding: 5px 18px; border-radius: 8px; font-weight: 700; color: var(--muted); transition: background .15s, color .15s; }

.settings-block { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); column-gap: 32px; row-gap: 12px; align-items: start; }

@media (pointer: coarse) {
  .nav-item, .btn, select, input[type="text"], input[type="email"], input[type="number"], input[type="date"], input[type="search"], input[type="tel"], .seg button { min-height: 44px; }

}
@media (max-width: 700px) {
  .settings-block { grid-template-columns: minmax(0, 1fr); }

@media (max-width: 640px) {
  .view-tools { justify-content: stretch; }

/* Statements and tables (accounting-style: dense, ruled, totals emphasised) */
.table-wrap { overflow-x: auto; margin: 0 -8px; }

/* ---- Modern dashboard: hero, sparklines, segmented control ---- */

<style id="ledger">
/* ===== LEDGER design system: a new visual language that replaces the earlier teal "dashboard" look ===== */
:root {

<script>
/* Shared helpers. Everything in the app hangs off one global namespace: BOS. */
window.BOS = window.BOS || {};
(function (B) {
  'use strict';
  const pad = n => String(n).padStart(2, '0');

  B.BUILD = '2026-11-19.2'; // shown in Settings so you can tell which copy of the app a device is running
  B.$ = (sel, root = document) => root.querySelector(sel);
  B.$$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  B.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  B.css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  B.uid = prefix => prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  const currency = () => (B.store && B.store.state && B.store.state.settings.currency) || 'USD';
  const loc = () => (B.i18n ? B.i18n.locale() : 'en-US');

  // All records are stored in US dollars. Choosing another currency converts every amount
  // with the rates in Settings (central-bank rates, Aug 2026, entered by hand).
  B.DEFAULT_RATES = { UZS: 11850, RUB: 84 };
  const rate = () => {
    const c = currency();
    if (c === 'USD') return 1;
    const saved = Number(((B.store.state.settings.rates) || {})[c]);
    return saved > 0 ? saved : B.DEFAULT_RATES[c] || 1;
  };
  const intl = (digits, extra) => new Intl.NumberFormat(loc(), { style: 'currency', currency: currency(), minimumFractionDigits: 0, maximumFractionDigits: digits, ...extra });
  const bigSum = v => currency() === 'UZS' && Math.abs(v) >= 1e9;

  B.fmt = {
    iso: d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
    today: () => B.fmt.iso(new Date()),
    rate,
    rate0: c => ((B.store.state.settings.rates || {})[c]) || B.DEFAULT_RATES[c],   // rate for a given code, for Settings
    conv: n => n * rate(),                          // stored USD -> chosen currency
    show: v => intl(currency() === 'UZS' ? 0 : 2).format(v),   // v is already in the chosen currency
    show0: v => (bigSum(v) ? intl(2, { notation: 'compact' }) : intl(0)).format(v),
    money: n => B.fmt.show(n * rate()),             // stored USD in, formatted chosen currency out
    money0: n => B.fmt.show0(n * rate()),
    compact: v => new Intl.NumberFormat(loc(), { style: 'currency', currency: currency(), notation: 'compact', maximumFractionDigits: 1 }).format(v),
    pct: n => `${n.toFixed(1)}%`,
    num: n => new Intl.NumberFormat(loc()).format(n),
    date: iso => new Date(iso + 'T00:00:00').toLocaleDateString(loc(), { month: 'short', day: 'numeric', year: 'numeric' }),

  };

  ];

  // Names shown in the chosen language (uz is the default name on each record).
  const NAMES = {
    p1: { en: 'Arabica Coffee Beans 1kg', ru: 'Кофе в зёрнах Арабика 1 кг' },
    p2: { en: 'Classic Coffee Beans 1kg', ru: 'Кофе в зёрнах Классик 1 кг' },
    p3: { en: 'Ground Coffee 1kg', ru: 'Молотый кофе 1 кг' },
    p4: { en: 'Instant Coffee 500g', ru: 'Растворимый кофе 500 г' },
    p5: { en: 'Coffee 3in1 (20 pcs)', ru: 'Кофе 3в1 (20 шт.)' },
    p6: { en: 'Cappuccino 3in1 (50 pcs)', ru: 'Капучино 3в1 (50 шт.)' },
    p7: { en: 'Cezve (Turkish coffee pot)', ru: 'Джезва (турка)' },
    p8: { en: 'Thermal Mug', ru: 'Термокружка' },
    p9: { en: 'Capsule Coffee Machine', ru: 'Капсульная кофемашина' },
    p10: { en: 'Electric Kettle', ru: 'Электрочайник' },
    c8: { en: 'Walk-in customer (cash)', ru: 'Покупатель (наличные)' }
  };
  const withNames = item => (NAMES[item.id] ? { ...item, i18n: NAMES[item.id] } : { ...item });

  const DEMO_VERSION = 3; // bump when the sample business changes

  function generate() {
    const rand = rng(2026);
    const between = (a, b) => a + rand() * (b - a);
    const pick = arr => arr[Math.floor(rand() * arr.length)];
    const now = new Date();
    const iso = B.fmt.iso;
    const products = PRODUCTS.map(withNames);
    const sales = [], expenses = [], purchases = [];
    let saleNo = 1001;

    for (let back = 11; back >= 0; back--) {
      const first = new Date(now.getFullYear(), now.getMonth() - back, 1);
      const lastDay = back === 0 ? now.getDate() : new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
      const growth = 1 + (11 - back) * 0.025;
      const at = day => iso(new Date(first.getFullYear(), first.getMonth(), day));
      const sold = {};

      const count = Math.round(between(34, 44) * growth * (lastDay / (back === 0 ? 30 : lastDay)));
      for (let i = 0; i < count; i++) {
        const day = 1 + Math.floor(rand() * lastDay);
        const lines = [];
        const chosen = new Set();
        const lineCount = 1 + Math.floor(rand() * 3);
        while (chosen.size < lineCount) chosen.add(pick(products));
        chosen.forEach(p => {
          const qty = Math.max(1, Math.round(between(p.lot[0], p.lot[1]) * growth));
          lines.push({ productId: p.id, qty, price: p.sellPrice, cost: p.purchasePrice });
          sold[p.id] = (sold[p.id] || 0) + qty;
        });
        const ageDays = (now - new Date(first.getFullYear(), first.getMonth(), day)) / 864e5;
        const paid = ageDays > 25 ? rand() < .97 : rand() < .72;
        sales.push({ id: 'S-' + saleNo++, date: at(day), customerId: pick(CUSTOMERS).id, items: lines, status: paid ? 'paid' : 'unpaid' });
      }

      // Supplier purchases roughly replace what was sold (cash goes out when stock is bought).
      if (lastDay >= 2) {
        products.forEach(p => {
          if (sold[p.id]) purchases.push({ id: `PO-${back}-${p.id}`, date: at(2), supplierId: p.supplierId, productId: p.id, qty: Math.ceil(sold[p.id] * 1.02), unitCost: p.purchasePrice, paid: true });
        });
      }

      const exp = (day, category, description, amount) => {
        if (day <= lastDay) expenses.push({ id: `E-${back}-${category}`, date: at(day), category, description, amount: Math.round(amount), paid: true });
      };
      exp(1, 'Rent', 'Shop and storage rent', 2200);
      exp(28, 'Salaries', 'Team salaries', 5600 + (11 - back) * 60);
      exp(10, 'Marketing', 'Ads and promotions', between(650, 1050));
      exp(15, 'Utilities', 'Power, water, internet', between(250, 380));
      exp(3, 'Software', 'Subscriptions', 150);
      exp(5, 'Insurance', 'Business insurance', 120);
    }

    return {
      version: 1, demoVersion: DEMO_VERSION,
      settings: { ownerName: 'Zokirov Abror', businessName: 'Qahva Optom Savdo', currency: 'USD', theme: 'light', language: B.i18n.detect() },
      products, customers: CUSTOMERS.map(withNames), suppliers: SUPPLIERS.map(s => ({ ...s })),
      sales, expenses, purchases
    };
  }

  B.demo = { generate, VERSION: DEMO_VERSION };
})(window.BOS);

<script>
/* Single source of truth. Modules read B.store.state and change it only through update(). */
(function (B) {
  'use strict';
  const KEY = 'businessos.v2';
  const listeners = new Set();

  B.store = {
    state: null,

    load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const saved = JSON.parse(raw);
          if (saved && saved.version === 1 && Array.isArray(saved.sales)) {
            if (!['USD', 'UZS', 'RUB'].includes(saved.settings.currency)) saved.settings.currency = 'USD';
            // Stage 1: the workspace holds only demo data, so a newer sample business can replace it
            // (settings are kept). Remove this once users can enter their own records.
            if (saved.demoVersion !== B.demo.VERSION) {
              const fresh = B.demo.generate();
              fresh.settings = { ...fresh.settings, ...saved.settings };
              this.state = fresh; this.save(); return;
            }
            this.state = saved; return;
          }
        }
      } catch (err) { /* corrupted data: fall back to demo data */ }
      this.state = B.demo.generate();
      this.save();
    },

    save() {
      try { localStorage.setItem(KEY, JSON.stringify(this.state)); }
      catch (err) { B.toast && B.toast(B.t('Storage is full or blocked. Changes will not be saved.')); }
    },

    // update(state => { ...mutate... }) saves and notifies every listener.
    update(mutator) { mutator(this.state); this.save(); listeners.forEach(fn => fn(this.state)); },
    reset() { const keep = this.state.settings; this.state = B.demo.generate(); this.state.settings = { ...this.state.settings, ...keep }; this.save(); listeners.forEach(fn => fn(this.state)); },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  };
})(window.BOS);

</script>
<script>
/* Financial formulas. Pure functions: state in, numbers out. No DOM here.
 *
 *  Revenue            = value of sales made in the period (paid or not)
 *  COGS               = quantity sold × purchase cost at time of sale
 *  Gross Profit       = Revenue − COGS
 *  Total Expenses     = COGS + operating expenses (rent, salaries, marketing, ...)
 *  Net Profit         = Revenue − Total Expenses  (= Gross Profit − operating expenses)
 *  Profit Margin      = Net Profit ÷ Revenue × 100
 *  Cash Flow          = actual cash received (paid sales) − actual cash paid out (paid expenses + paid stock purchases)
 *  Inventory Value    = quantity on hand × purchase price
 *
 * Revenue, profit and cash flow differ on purpose: an unpaid sale is revenue but not cash,
 * and a stock purchase is cash out but not an expense until the goods are sold (COGS).
 */
(function (B) {
  'use strict';
  const sum = (arr, fn) => arr.reduce((s, x) => s + fn(x), 0);
  const saleTotal = s => sum(s.items, i => i.qty * i.price);
  const saleCost = s => sum(s.items, i => i.qty * i.cost);
  const between = (d, from, to) => d >= from && d <= to;

  const F = {
    saleTotal, saleCost,

    // Current period of N months (calendar months incl. this one) and the equal period before it.
    range(months, now = new Date()) {
      const y = now.getFullYear(), m = now.getMonth(), iso = B.fmt.iso;
      return {
        from: iso(new Date(y, m - (months - 1), 1)), to: iso(now),
        prevFrom: iso(new Date(y, m - (2 * months - 1), 1)), prevTo: iso(new Date(y, m - (months - 1), 0))
      };
    },

    summary(st, from, to) {
      const sales = st.sales.filter(s => between(s.date, from, to));
      const expenses = st.expenses.filter(e => between(e.date, from, to));
      const buys = st.purchases.filter(p => between(p.date, from, to));

      const revenue = sum(sales, saleTotal);
      const cogs = sum(sales, saleCost);
      const opex = sum(expenses, e => e.amount);
      const totalExpenses = cogs + opex;
      const netProfit = revenue - totalExpenses;
      const cashIn = sum(sales.filter(s => s.status === 'paid'), saleTotal);
      const paidExpenses = sum(expenses.filter(e => e.paid), e => e.amount);
      const paidStock = sum(buys.filter(p => p.paid), p => p.qty * p.unitCost);
      const cashOut = paidExpenses + paidStock;

      return {
        revenue, cogs, grossProfit: revenue - cogs, opex, totalExpenses, netProfit,
        margin: revenue ? (netProfit / revenue) * 100 : 0,
        cashIn, cashOut, paidExpenses, paidStock, cashFlow: cashIn - cashOut,
        receivables: revenue - cashIn, salesCount: sales.length
      };
    },

    change: (cur, prev) => (prev === 0 ? null : ((cur - prev) / Math.abs(prev)) * 100),

    monthly(st, count = 12) {
      const now = new Date(), rows = [];
      for (let i = count - 1; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        rows.push({ label: B.fmt.month(d), ...F.summary(st, key + '-01', key + '-31') });
      }
      return rows;
    },

    inventoryValue: st => sum(st.products, p => p.qty * p.purchasePrice),
    lowStock: st => st.products.filter(p => p.qty <= p.reorderLevel).sort((a, b) => a.qty / a.reorderLevel - b.qty / b.reorderLevel),

    topProducts(st, from, to, limit = 5) {
      const map = {};
      st.sales.filter(s => between(s.date, from, to)).forEach(s => s.items.forEach(i => {
        const row = map[i.productId] || (map[i.productId] = { productId: i.productId, units: 0, revenue: 0 });
        row.units += i.qty; row.revenue += i.qty * i.price;
      }));
      return Object.values(map).sort((a, b) => b.units - a.units).slice(0, limit)
        .map(r => { const p = st.products.find(x => x.id === r.productId); return { ...r, name: p ? B.label(p) : 'Deleted product' }; });
    },

    costBreakdown(st, from, to) {
      const s = F.summary(st, from, to), map = { 'Cost of goods sold': s.cogs };
      st.expenses.filter(e => between(e.date, from, to)).forEach(e => { map[e.category] = (map[e.category] || 0) + e.amount; });
      return Object.entries(map).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    }
  };
  B.finance = F;
})(window.BOS);

</script>

<script>
/* Hash router + sidebar. A module is { id, title, sub, icon, group, render(root), destroy?() }. */
(function (B) {
  'use strict';
  const order = [];
  B.modules = {};
  B.register = mod => { B.modules[mod.id] = mod; order.push(mod.id); };

  // Hash names are plain "bos-<id>" (letters, digits, hyphen). Hosts such as published pages
  // only pass simple #names through, and some names (e.g. "settings") are reserved by them.
  const PREFIX = 'bos-';
  const idFromHash = () => { const h = location.hash.replace('#', ''); return h.indexOf(PREFIX) === 0 ? h.slice(PREFIX.length) : ''; };

  B.router = {
    current: null,

    buildNav() {
      let group = '';
      const RANK = ['Overview', 'Operations', 'Relationships', 'Insights', 'System'];
      B.$('#nav').innerHTML = order.slice().sort((a, b) => RANK.indexOf(B.modules[a].group) - RANK.indexOf(B.modules[b].group)).map(id => {
        const m = B.modules[id];
        const label = m.group !== group ? `<p class="nav-group">${B.t(m.group)}</p>` : '';
        group = m.group;
        return `${label}<a class="nav-item" href="#${PREFIX}${id}" data-id="${id}" title="${B.t(m.title)}">${B.icon(m.icon)}<span>${B.t(m.title)}</span></a>`;
      }).join('');
    },

    start() {
      this.buildNav();
      // Clicks switch the page directly; the hash is only kept in sync for back/forward and bookmarks.
      B.$('#nav').addEventListener('click', e => {
        const a = e.target.closest('a[data-id]');
        if (a) { e.preventDefault(); this.navigate(a.dataset.id); }
      });
      window.addEventListener('hashchange', () => this.go());
      B.store.subscribe(() => { this.buildNav(); this.show(this.current, true); });
      this.go();
    },

    navigate(id) {
      if (!B.modules[id]) return;
      if (B.modules[id] !== this.current) this.show(B.modules[id], false);
      try { if (idFromHash() !== id) location.hash = PREFIX + id; } catch (err) { /* hash not writable here: fine */ }
    },

    go() {
      const mod = B.modules[idFromHash()];
      if (mod) { if (mod !== this.current) this.show(mod, false); }
      else if (!this.current) this.show(B.modules[order[0]], false);
    },

    show(mod, isRefresh) {
      if (this.current && this.current.destroy) this.current.destroy();
      this.current = mod;
      B.$$('.nav-item').forEach(a => a.classList.toggle('is-active', a.dataset.id === mod.id));
      B.$('#pageTitle').textContent = B.t(mod.title);
      B.$('#pageSub').textContent = B.t(mod.sub);
      document.title = `${B.t(mod.title)} · Business OS`;
      const root = B.$('#view');
      root.innerHTML = '';
      root.classList.remove('enter');
      if (!isRefresh) { void root.offsetWidth; root.classList.add('enter'); }
      try { mod.render(root); }
      catch (err) {
        console.error(err);
        root.innerHTML = `<section class="card empty-state"><h2>Something went wrong</h2><p>${B.esc(err.message)}</p></section>`;
      }
      if (!isRefresh) { window.scrollTo({ top: 0 }); B.closeSidebar(); }
    }
  };

  B.openSidebar = () => { B.$('#sidebar').classList.add('is-open'); B.$('#scrim').classList.add('is-visible'); document.body.classList.add('nav-open'); };
  B.closeSidebar = () => { B.$('#sidebar').classList.remove('is-open'); B.$('#scrim').classList.remove('is-visible'); document.body.classList.remove('nav-open'); };
})(window.BOS);

</script>
<script>
/* Command palette (Ctrl/Cmd + K): jump to any page by typing. */
(function (B) {
  'use strict';
  let dlg, input, list, items = [], active = 0;

  function build() {
    dlg = document.createElement('dialog');
    dlg.className = 'palette';
    dlg.innerHTML = '<input type="text" id="palInput" autocomplete="off"><ul id="palList" role="listbox"></ul>';
    document.body.appendChild(dlg);
    input = B.$('#palInput', dlg); list = B.$('#palList', dlg);
    input.addEventListener('input', () => { active = 0; draw(); });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { active = Math.min(active + 1, items.length - 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); draw(); e.preventDefault(); }
      else if (e.key === 'Enter' && items[active]) go(items[active].id);
    });
    list.addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) go(b.dataset.id); });
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  }

  function go(id) { dlg.close(); B.router.navigate(id); }

  function draw() {
    const q = input.value.trim().toLowerCase();
    const inTitle = m => B.t(m.title).toLowerCase().includes(q);
    items = Object.keys(B.modules).map(id => B.modules[id])
      .filter(m => !q || (B.t(m.title) + ' ' + B.t(m.sub)).toLowerCase().includes(q))
      .sort((a, b) => Number(inTitle(b)) - Number(inTitle(a)));   // title matches first
    list.innerHTML = items.length
      ? items.map((m, i) => `<li><button type="button" role="option" data-id="${m.id}" class="${i === active ? 'is-active' : ''}">${B.icon(m.icon)}<span><b>${B.esc(B.t(m.title))}</b><small>${B.esc(B.t(m.sub))}</small></span></button></li>`).join('')
      : `<li class="palette-empty">${B.t('No results')}</li>`;
  }

  B.palette = {
    open() {
      if (!dlg) build();
      if (dlg.open) return;
      input.placeholder = B.t('Search pages…');
      input.value = ''; active = 0; draw();
      dlg.showModal();
      input.focus();
    }
  };
})(window.BOS);

</script>
<script>
/* Dashboard: revenue, profit and cash flow side by side, plus stock alerts and recent sales. */
(function (B) {
  'use strict';
  const { esc, fmt, t, finance: F } = B;
  const PALETTE = ['#0f766e', '#d9573b', '#3b4bd8', '#e0a526', '#7a5af8', '#2ba3c4', '#8a9490'];
  let charts = [];
  let months = 3;

  const delta = (pct, extra = '') => pct === null
    ? `<p class="kpi-delta">${t('No earlier period to compare')}</p>`
    : `<p class="kpi-delta ${pct >= 0 ? 'is-good' : 'is-bad'}">${pct >= 0 ? '▲' : '▼'} ${t('{p}% vs previous period', { p: Math.abs(pct).toFixed(1) })}</p>${extra}`;

  // Smooth SVG sparkline (no chart library needed, so it always renders)
  function spark(values, cls = '') {
    const w = 120, h = 40, n = values.length;
    const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
    const pts = values.map((v, i) => [(i / (n - 1)) * w, h - 5 - ((v - min) / span) * (h - 10)]);
    let line = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < n; i++) { const cx = (pts[i - 1][0] + pts[i][0]) / 2; line += ` C${cx},${pts[i - 1][1]} ${cx},${pts[i][1]} ${pts[i][0]},${pts[i][1]}`; }
    return `<svg class="spark ${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="area" d="${line} L${w},${h} L0,${h} Z"/><path class="line" d="${line}"/></svg>`;
  }

  // Numbers count up when a page opens (skipped when the user prefers reduced motion)
  function animateNumbers(root) {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    B.$$('[data-count]', root).forEach(el => {
      const end = Number(el.dataset.count), format = el.dataset.fmt === 'pct' ? fmt.pct : fmt.money0, t0 = performance.now();
      const tick = now => {
        const k = Math.min(1, (now - t0) / 800);
        el.textContent = format(end * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  const kpi = ({ label, caption, value, count, kind = 'money0', delta: footer, icon, series }) =>
    `<article class="card kpi"><div class="kpi-top"><p class="kpi-label">${t(label)}</p><span class="kpi-icon">${B.icon(icon)}</span></div>
      <p class="kpi-value" data-count="${count}" data-fmt="${kind}">${value}</p><p class="kpi-caption">${t(caption)}</p>${footer}${spark(series)}</article>`;
  const initials = name => name.split(/\s+/).filter(w => /^\p{L}/u.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase();

  const stockRow = p => {
    const pct = Math.min(100, Math.round((p.qty / p.reorderLevel) * 100)), bad = p.qty === 0 || pct < 40;
    return `<li class="row"><div class="row-main"><p class="row-title">${esc(B.label(p))}</p>
      <div class="meter ${bad ? 'is-bad' : 'is-warn'}"><i style="width:${pct}%"></i></div>
      <p class="row-sub">${t('{q} left · reorder at {r}', { q: fmt.num(p.qty), r: fmt.num(p.reorderLevel) })}</p></div>
      <span class="tag ${bad ? 'tag-bad' : 'tag-warn'}">${t(p.qty === 0 ? 'Out of stock' : 'Low stock')}</span></li>`;
  };

  function render(root) {
    const st = B.store.state, r = F.range(months);
    const cur = F.summary(st, r.from, r.to), prev = F.summary(st, r.prevFrom, r.prevTo);
    const low = F.lowStock(st), top = F.topProducts(st, r.from, r.to, 5);
    const recent = [...st.sales].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, 5);
    const customer = id => { const c = st.customers.find(x => x.id === id); return c ? B.label(c) : t('Unknown customer'); };
    const marginDiff = prev.revenue ? cur.margin - prev.margin : null;

    // Profit and loss statement rows (amounts in stored USD; formatted on output)
    const byCategory = (from, to) => { const m = {}; st.expenses.filter(e => e.date >= from && e.date <= to).forEach(e => { m[e.category] = (m[e.category] || 0) + e.amount; }); return m; };
    const oc = byCategory(r.from, r.to), op = byCategory(r.prevFrom, r.prevTo);
    const cats = [...new Set([...Object.keys(oc), ...Object.keys(op)])].sort((a, b) => (oc[b] || 0) - (oc[a] || 0));
    const plRows = [
      ['Revenue', cur.revenue, prev.revenue, ''], ['Cost of goods sold', cur.cogs, prev.cogs, ''],
      ['Gross profit', cur.grossProfit, prev.grossProfit, 'subtotal'],
      ...cats.map(c => [c, oc[c] || 0, op[c] || 0, 'indent']),
      ['Total operating expenses', cur.opex, prev.opex, 'subtotal'], ['Net profit', cur.netProfit, prev.netProfit, 'total']
    ];
    const change = (c, p) => { const v = F.change(c, p); return v === null ? '—' : `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}%`; };
    const plBody = plRows.map(([label, c, p, cls]) => `<tr class="${cls}"><td>${esc(t(label))}</td><td class="num">${fmt.money0(c)}</td><td class="num muted">${fmt.money0(p)}</td><td class="num muted">${change(c, p)}</td></tr>`).join('')
      + `<tr><td>${t('Profit Margin')}</td><td class="num">${fmt.pct(cur.margin)}</td><td class="num muted">${fmt.pct(prev.margin)}</td><td class="num muted">${marginDiff === null ? '—' : `${marginDiff >= 0 ? '+' : '−'}${Math.abs(marginDiff).toFixed(1)} ${t('pts')}`}</td></tr>`;
    const out = v => `−${fmt.money0(v)}`;

    const marginFooter = marginDiff === null ? delta(null)
      : `<p class="kpi-delta ${marginDiff >= 0 ? 'is-good' : 'is-bad'}">${marginDiff >= 0 ? '▲' : '▼'} ${t('{p} pts vs previous period', { p: Math.abs(marginDiff).toFixed(1) })}</p>`;
    const months12 = F.monthly(st, 12);
    const hour = new Date().getHours();
    const greeting = t(hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening');
    const firstName = (st.settings.ownerName || '').trim().split(/\s+/).pop();
    const periodLabel = t({ 1: 'This month', 3: 'Last 3 months', 6: 'Last 6 months', 12: 'Last 12 months' }[months]);
    const healthy = st.products.length ? Math.round(((st.products.length - low.length) / st.products.length) * 100) : 100;

    root.innerHTML = `
      <section class="top-grid">
        <article class="hero">
          <div class="hero-main">
            <p class="hero-hello">${esc(greeting)}${firstName ? ', ' + esc(firstName) : ''}</p>
            <p class="hero-label">${t('Net Profit')} · ${periodLabel}</p>
            <p class="hero-value" data-count="${cur.netProfit}" data-fmt="money0">${fmt.money0(cur.netProfit)}</p>
            ${delta(F.change(cur.netProfit, prev.netProfit))}
            <p class="hero-note">${t('Revenue − all expenses, incl. goods sold')}</p>
          </div>
          <div class="hero-side">
            <div class="seg" role="group" aria-label="${t('Reporting period')}">
              ${[1, 3, 6, 12].map(m => `<button type="button" data-months="${m}" class="${m === months ? 'is-active' : ''}">${t(m + 'M')}</button>`).join('')}
            </div>
            ${spark(months12.map(r => r.netProfit), 'spark-hero')}
            <div class="hero-actions">
              <button class="btn btn-ghost" id="exportBtn" type="button">${t('Export CSV')}</button>
              <button class="btn btn-ghost" id="printBtn" type="button">${t('Print')}</button>
            </div>
          </div>
        </article>
        <article class="card kpi stock-card">
          <div class="kpi-top"><p class="kpi-label">${t('Inventory Value')}</p><span class="kpi-icon">${B.icon('inventory')}</span></div>
          <p class="kpi-value" data-count="${F.inventoryValue(st)}" data-fmt="money0">${fmt.money0(F.inventoryValue(st))}</p>
          <p class="kpi-caption">${t('Quantity × purchase price, today')}</p>
          <div class="meter ${healthy < 70 ? 'is-warn' : ''}"><i style="width:${healthy}%"></i></div>
          <p class="kpi-delta ${low.length ? 'is-bad' : 'is-good'}">${low.length ? t('Needs restocking: {n}', { n: low.length }) : t('All stock above reorder level')}</p>
        </article>
      </section>

      <section class="grid-kpi4" aria-label="${t('Key figures')}">
        ${kpi({ label: 'Total Revenue', caption: 'Sales made, paid or not', value: fmt.money0(cur.revenue), count: cur.revenue, delta: delta(F.change(cur.revenue, prev.revenue)), icon: 'revenue', series: months12.map(r => r.revenue) })}
        ${kpi({ label: 'Gross Profit', caption: 'Revenue − cost of goods sold', value: fmt.money0(cur.grossProfit), count: cur.grossProfit, delta: delta(F.change(cur.grossProfit, prev.grossProfit)), icon: 'gross', series: months12.map(r => r.grossProfit) })}
        ${kpi({ label: 'Profit Margin', caption: 'Net profit ÷ revenue', value: fmt.pct(cur.margin), count: cur.margin, kind: 'pct', delta: marginFooter, icon: 'margin', series: months12.map(r => r.margin) })}
        ${kpi({ label: 'Cash Flow', caption: 'Cash received − cash paid out', value: fmt.money0(cur.cashFlow), count: cur.cashFlow, delta: delta(F.change(cur.cashFlow, prev.cashFlow)), icon: 'cash', series: months12.map(r => r.cashFlow) })}
      </section>

      <section class="grid-main">
        <article class="card">
          <div class="card-head"><h2>${t('Revenue, Expenses and Net Profit')}</h2><p class="card-sub">${t('By month, last 12 months')}</p></div>
          <div class="chart-box"><canvas id="trendChart" role="img" aria-label="${t('Revenue, Expenses and Net Profit')}"></canvas></div>
        </article>
        <article class="card">
          <div class="card-head"><h2>${t('Where the money goes')}</h2><p class="card-sub">${t('Total expenses in the period')}</p></div>
          <div class="chart-box"><canvas id="costChart" role="img" aria-label="${t('Where the money goes')}"></canvas></div>
        </article>
      </section>

      <section class="grid-three">
        <article class="card">
          <div class="card-head"><h2>${t('Restock soon')}</h2><p class="card-sub">${t('At or below reorder level')}</p></div>
          ${low.length ? `<ul class="row-list">${low.slice(0, 5).map(stockRow).join('')}</ul>${low.length > 5 ? `<p class="row-sub">${t('+{n} more', { n: low.length - 5 })}</p>` : ''}`
            : `<p class="empty-inline">${t('Nothing to restock. Every product is above its reorder level.')}</p>`}
        </article>
        <article class="card">
          <div class="card-head"><h2>${t('Fastest selling')}</h2><p class="card-sub">${t('Units sold in the period')}</p></div>
          ${top.length ? `<ul class="row-list">${top.map((p, i) => `<li class="row"><span class="rank">${i + 1}</span><div class="row-main"><p class="row-title">${esc(p.name)}</p>
              <div class="meter"><i style="width:${Math.round((p.units / top[0].units) * 100)}%"></i></div><p class="row-sub">${t('{n} units', { n: fmt.num(p.units) })}</p></div><p class="row-value">${fmt.money0(p.revenue)}</p></li>`).join('')}</ul>`
            : `<p class="empty-inline">${t('No sales in this period yet.')}</p>`}
        </article>
        <article class="card">
          <div class="card-head"><h2>${t('Recent sales')}</h2><p class="card-sub">${t('Latest five orders')}</p></div>
          ${recent.length ? `<ul class="row-list">${recent.map(s => `<li class="row"><span class="avatar-sm">${esc(initials(customer(s.customerId)))}</span><div class="row-main"><p class="row-title">${esc(customer(s.customerId))}</p><p class="row-sub">${s.id} · ${fmt.date(s.date)}</p></div>
              <div class="row-end"><p class="row-value">${fmt.money0(F.saleTotal(s))}</p><span class="tag ${s.status === 'paid' ? 'tag-good' : 'tag-warn'}">${t(s.status === 'paid' ? 'Paid' : 'Unpaid')}</span></div></li>`).join('')}</ul>`
            : `<p class="empty-inline">${t('No sales recorded yet.')}</p>`}
        </article>
      </section>

      <section class="grid-main">
        <article class="card">
          <div class="card-head"><h2>${t('Profit and loss')}</h2><p class="card-sub">${t('Financial statements')}</p></div>
          <div class="table-wrap"><table class="statement">
            <thead><tr><th>${t('Item')}</th><th class="num">${t('Current period')}</th><th class="num">${t('Previous period')}</th><th class="num">${t('Change')}</th></tr></thead>
            <tbody>${plBody}</tbody>
          </table></div>
        </article>
        <article class="card">
          <div class="card-head"><h2>${t('Cash flow statement')}</h2><p class="card-sub">${t('Current period')}</p></div>
          <div class="table-wrap"><table class="statement">
            <thead><tr><th>${t('Item')}</th><th class="num">${t('Amount')}</th></tr></thead>
            <tbody>
              <tr><td>${t('Cash received from customers')}</td><td class="num">${fmt.money0(cur.cashIn)}</td></tr>
              <tr><td>${t('Paid for expenses')}</td><td class="num">${out(cur.paidExpenses)}</td></tr>
              <tr><td>${t('Paid to suppliers for stock')}</td><td class="num">${out(cur.paidStock)}</td></tr>
              <tr class="total"><td>${t('Net cash flow')}</td><td class="num">${fmt.money0(cur.cashFlow)}</td></tr>
              <tr><td class="muted">${t('Not yet collected from customers')}</td><td class="num muted">${fmt.money0(cur.receivables)}</td></tr>
            </tbody>
          </table></div>
          <p class="note">${t('Revenue counts a sale when it is made, profit subtracts every cost, cash flow counts only money that actually moved.')}</p>
        </article>
      </section>`;

    B.$('#printBtn').addEventListener('click', () => window.print());
    B.$('#exportBtn').addEventListener('click', () => exportCSV(plRows));
    B.$$('.seg button[data-months]').forEach(btn => btn.addEventListener('click', () => { months = Number(btn.dataset.months); B.router.show(mod, true); }));
    animateNumbers(root);
    drawCharts(st, F.costBreakdown(st, r.from, r.to));
  }

  // Export the profit and loss table (amounts in the chosen currency, UTF-8 with BOM so Excel reads any language).
  function exportCSV(rows) {
    const cell = v => `"${String(v).replace(/"/g, '""')}"`;
    const data = [[t('Item'), t('Current period'), t('Previous period')],
      ...rows.map(([label, c, p]) => [t(label), Math.round(fmt.conv(c) * 100) / 100, Math.round(fmt.conv(p) * 100) / 100])];
    const blob = new Blob(['\ufeff' + data.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'business-os-profit-and-loss.csv' });
    a.click();
    URL.revokeObjectURL(a.href);
    B.toast(t('CSV exported'));
  }

  // Draws the total inside the doughnut hole
  const centerText = {
    id: 'centerText',
    afterDraw(chart, args, opts) {
      if (!opts || !opts.enabled) return;
      const { ctx, chartArea: a } = chart, x = (a.left + a.right) / 2, y = (a.top + a.bottom) / 2;
      ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = B.css('--muted'); ctx.font = "600 11px 'Inter', system-ui, sans-serif"; ctx.fillText(opts.label, x, y - 12);
      ctx.fillStyle = B.css('--text'); ctx.font = "700 17px 'Inter', system-ui, sans-serif"; ctx.fillText(opts.value, x, y + 8);
      ctx.restore();
    }
  };

  function drawCharts(st, costs) {
    if (typeof Chart === 'undefined') {   // CDN blocked or offline: keep the rest of the dashboard usable
      B.$$('.chart-box').forEach(b => { b.innerHTML = `<p class="empty-inline">${t('Charts could not load. Check your internet connection.')}</p>`; });
      return;
    }
    B.chartDefaults();
    const rows = F.monthly(st, 12);
    const fade = hex => ctx => {
      const a = ctx.chart.chartArea;
      if (!a) return hex + '22';
      const g = ctx.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
      g.addColorStop(0, hex + '30'); g.addColorStop(1, hex + '00');
      return g;
    };
    const tooltip = { backgroundColor: '#10201e', padding: 10, cornerRadius: 8, callbacks: { label: c => ` ${c.dataset.label || c.label}: ${fmt.show0(c.parsed.y !== undefined ? c.parsed.y : c.parsed)}` } };

    charts.push(new Chart(B.$('#trendChart'), {
      data: {
        labels: rows.map(r => r.label),
        datasets: [
          { type: 'bar', label: t('Net profit'), data: rows.map(r => fmt.conv(r.netProfit)), backgroundColor: rows.map(r => (r.netProfit >= 0 ? B.css('--brand') : B.css('--bad'))), borderRadius: 5, maxBarThickness: 22, order: 2 },
          { type: 'line', label: t('Revenue'), data: rows.map(r => fmt.conv(r.revenue)), borderColor: '#4f5df0', backgroundColor: fade('#4f5df0'), fill: true, tension: .35, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2.5, order: 1 },
          { type: 'line', label: t('Total expenses'), data: rows.map(r => fmt.conv(r.totalExpenses)), borderColor: '#e0a526', tension: .35, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2.5, order: 1 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { align: 'end', labels: { usePointStyle: true, boxWidth: 8, boxHeight: 8 } }, tooltip },
        scales: { x: { grid: { display: false }, border: { display: false } }, y: { border: { display: false }, grid: { color: B.css('--line') }, ticks: { callback: v => fmt.compact(v), maxTicksLimit: 6 } } }
      }
    }));

    const top = costs.slice(0, 6).map(([name, v]) => [t(name), v]);
    const rest = costs.slice(6).reduce((s, [, v]) => s + v, 0);
    if (rest > 0) top.push([t('Other'), rest]);
    charts.push(new Chart(B.$('#costChart'), {
      type: 'doughnut', plugins: [centerText],
      data: { labels: top.length ? top.map(c => c[0]) : [t('No expenses')], datasets: [{ data: top.length ? top.map(c => fmt.conv(c[1])) : [1], backgroundColor: top.length ? PALETTE : [B.css('--line')], borderWidth: 2, borderColor: B.css('--card') }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { centerText: { label: t('Total expenses'), value: fmt.show0(top.reduce((sum, c) => sum + fmt.conv(c[1]), 0)), enabled: costs.length > 0 }, legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, boxHeight: 8, padding: 10 } }, tooltip } }
    }));
  }

  const mod = {
    id: 'dashboard', title: 'Dashboard', sub: 'Your business at a glance', icon: 'dashboard', group: 'Overview',
    render, destroy() { charts.forEach(c => c.destroy()); charts = []; }
  };
  B.register(mod);
})(window.BOS);

</script>
<script>
/* Sales module: create, search, pay, delete (with stock handling) and print invoices.
 * Prices are stored in USD like the rest of the app. Discount scales line prices at creation,
 * so history never changes when a product's price is edited later. */
(function (B) {
  'use strict';
  const L = B.finance, esc = B.esc;
  const T = (en, uz, ru) => ({ en, uz, ru }[B.i18n.lang()] || en);
  let q = '', filter = 'all', dlg;

  const cust = (st, id) => st.customers.find(c => c.id === id);
  const prod = (st, id) => st.products.find(p => p.id === id);
  const total = s => L.saleTotal(s);

  function ensureDialog() {
    if (dlg) return dlg;
    dlg = document.createElement('dialog');
    dlg.className = 'card'; dlg.style.cssText = 'width:min(680px,94vw);max-height:90vh;overflow:auto;padding:20px';
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
    document.body.appendChild(dlg); return dlg;
  }

  function render(root) {
    const st = B.store.state;
    const rows = st.sales.filter(s => {
      if (filter !== 'all' && s.status !== filter) return false;
      const c = cust(st, s.customerId);
      return !q || (s.id + ' ' + (c ? B.label(c) : '')).toLowerCase().includes(q.toLowerCase());
    }).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, 100);
    const open = st.sales.filter(s => s.status === 'unpaid');
    root.innerHTML = `<section class="card">
      <div class="view-tools" style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
        <input id="sq" type="search" placeholder="${esc(T('Search sale or customer…', 'Sotuv yoki mijozni izlash…', 'Поиск продажи или клиента…'))}" value="${esc(q)}" style="flex:1;min-width:140px">
        <select id="sf" aria-label="${esc(T('Status', 'Holat', 'Статус'))}">
          ${[['all', T('All', 'Hammasi', 'Все')], ['paid', T('Paid', "To'langan", 'Оплачено')], ['unpaid', T('Unpaid', "To'lanmagan", 'Не оплачено')]].map(([v, l]) => `<option value="${v}" ${v === filter ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
        <button class="btn btn-primary" id="newSale" type="button">${B.icon('sales')}${T('New sale', 'Yangi sotuv', 'Новая продажа')}</button>
      </div>
      <p class="muted" style="margin-bottom:10px">${T('Outstanding receivables', 'Qarzdorlik', 'Дебиторская задолженность')}: <b>${B.fmt.money(open.reduce((a, s) => a + total(s), 0))}</b> (${open.length})</p>
      ${rows.length ? `<div class="table-wrap"><table class="statement"><thead><tr><th>#</th><th>${T('Date', 'Sana', 'Дата')}</th><th>${T('Customer', 'Mijoz', 'Клиент')}</th><th class="num">${T('Total', 'Jami', 'Итого')}</th><th>${T('Status', 'Holat', 'Статус')}</th><th></th></tr></thead><tbody>
      ${rows.map(s => { const c = cust(st, s.customerId); return `<tr><td>${esc(s.id)}</td><td>${B.fmt.date(s.date)}</td><td>${c ? esc(B.label(c)) : '—'}</td><td class="num">${B.fmt.money(total(s))}</td>
        <td><span class="tag ${s.status === 'paid' ? 'tag-good' : 'tag-warn'}">${s.status === 'paid' ? T('Paid', "To'langan", 'Оплачено') : T('Unpaid', "To'lanmagan", 'Не оплачено')}</span></td>
        <td class="num"><button class="btn btn-ghost" data-act="view" data-id="${s.id}" type="button">${T('Invoice', 'Hisob-faktura', 'Счёт')}</button>
        ${s.status === 'unpaid' ? `<button class="btn btn-ghost" data-act="pay" data-id="${s.id}" type="button">${T('Mark paid', "To'landi", 'Оплачено')}</button>` : ''}
        <button class="btn btn-danger" data-act="del" data-id="${s.id}" type="button">${T('Delete', "O'chirish", 'Удалить')}</button></td></tr>`; }).join('')}
      </tbody></table></div>` : `<p class="muted">${T('No sales match.', "Sotuvlar topilmadi.", 'Продажи не найдены.')}</p>`}
      <p class="note">${T('Showing the latest 100. Sales you create here reduce stock; the demo sales do not.', "Oxirgi 100 ta ko'rsatilgan. Bu yerda yaratilgan sotuvlar ombor qoldig'ini kamaytiradi; demo sotuvlar kamaytirmaydi.", 'Показаны последние 100. Созданные здесь продажи списывают остаток; демо-продажи — нет.')}</p></section>`;
    B.$('#sq', root).addEventListener('input', e => { q = e.target.value; const p = e.target.selectionStart; render(root); const n = B.$('#sq', root); n.focus(); n.setSelectionRange(p, p); });
    B.$('#sf', root).addEventListener('change', e => { filter = e.target.value; render(root); });
    B.$('#newSale', root).addEventListener('click', () => form(root));
    root.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act, b.dataset.id, root)));
  }

  function act(kind, id, root) {
    const st = B.store.state, s = st.sales.find(x => x.id === id); if (!s) return;
    if (kind === 'pay') { B.store.update(x => { x.sales.find(y => y.id === id).status = 'paid'; }); B.toast(T('Marked as paid', "To'langan deb belgilandi", 'Отмечено как оплаченное')); }
    if (kind === 'view') invoice(s);
    if (kind === 'del') {
      const d = ensureDialog();
      d.innerHTML = `<h2>${T('Delete sale', "Sotuvni o'chirish", 'Удалить продажу')} ${esc(id)}?</h2><p class="muted" style="margin:8px 0 16px">${s.stockApplied ? T('Stock will be returned to inventory.', "Mahsulotlar omborga qaytariladi.", 'Товар вернётся на склад.') : T('This demo sale did not change stock.', "Bu demo sotuv ombor qoldig'ini o'zgartirmagan.", 'Эта демо-продажа не меняла остатки.')}</p>
        <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" id="no" type="button">${T('Cancel', 'Bekor qilish', 'Отмена')}</button><button class="btn btn-danger" id="yes" type="button">${T('Delete', "O'chirish", 'Удалить')}</button></div>`;
      d.showModal(); B.$('#no', d).onclick = () => d.close();
      B.$('#yes', d).onclick = () => { B.store.update(x => { const i = x.sales.findIndex(y => y.id === id); const sale = x.sales[i];
        if (sale.stockApplied) sale.items.forEach(it => { const p = prod(x, it.productId); if (p) p.qty += it.qty; });
        x.sales.splice(i, 1); }); d.close(); B.toast(T('Sale deleted', "Sotuv o'chirildi", 'Продажа удалена')); };
    }
  }

  function form(root) {
    const st = B.store.state, d = ensureDialog();
    const lineHTML = () => `<div class="line" style="display:grid;grid-template-columns:1fr 90px auto;gap:8px;margin-bottom:8px">
      <select class="lp">${st.products.map(p => `<option value="${p.id}">${esc(B.label(p))} — ${B.fmt.money(p.sellPrice)} (${p.qty})</option>`).join('')}</select>
      <input class="lq" type="number" min="1" step="1" value="1" aria-label="${esc(T('Quantity', 'Miqdor', 'Кол-во'))}">
      <button class="btn btn-ghost lx" type="button" aria-label="${esc(T('Remove', "Olib tashlash", 'Убрать'))}">✕</button></div>`;
    d.innerHTML = `<h2>${T('New sale', 'Yangi sotuv', 'Новая продажа')}</h2><div style="display:grid;gap:12px;margin-top:12px">
      <label class="field">${T('Customer', 'Mijoz', 'Клиент')}<select id="fc">${st.customers.map(c => `<option value="${c.id}">${esc(B.label(c))}</option>`).join('')}</select></label>
      <div id="lines">${lineHTML()}</div>
      <div><button class="btn btn-ghost" id="addl" type="button">+ ${T('Add item', "Mahsulot qo'shish", 'Добавить товар')}</button></div>
      <label class="field">${T('Discount %', 'Chegirma %', 'Скидка %')}<input id="fd" type="number" min="0" max="100" step="0.1" value="0"></label>
      <label class="field">${T('Date', 'Sana', 'Дата')}<input id="fdate" type="date" value="${B.fmt.today()}" max="${B.fmt.today()}"></label>
      <label class="field">${T('Payment', "To'lov", 'Оплата')}<select id="fs"><option value="paid">${T('Paid', "To'langan", 'Оплачено')}</option><option value="unpaid">${T('Unpaid', "To'lanmagan", 'Не оплачено')}</option></select></label>
      <p class="error" id="ferr" role="alert" style="color:var(--bad);font-weight:600"></p>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" id="fc2" type="button">${T('Cancel', 'Bekor qilish', 'Отмена')}</button><button class="btn btn-primary" id="fsave" type="button">${T('Save sale', 'Saqlash', 'Сохранить')}</button></div></div>`;
    const wire = () => d.querySelectorAll('.lx').forEach(b => b.onclick = () => { if (d.querySelectorAll('.line').length > 1) b.closest('.line').remove(); });
    wire();
    B.$('#addl', d).onclick = () => { B.$('#lines', d).insertAdjacentHTML('beforeend', lineHTML()); wire(); };
    B.$('#fc2', d).onclick = () => d.close();
    B.$('#fsave', d).onclick = () => {
      const err = m => { B.$('#ferr', d).textContent = m; };
      const disc = Number(B.$('#fd', d).value);
      if (!Number.isFinite(disc) || disc < 0 || disc > 100) return err(T('Discount must be 0–100.', "Chegirma 0–100 oralig'ida bo'lsin.", 'Скидка должна быть от 0 до 100.'));
      const need = {};
      d.querySelectorAll('.line').forEach(l => { const id = B.$('.lp', l).value, n = Number(B.$('.lq', l).value); need[id] = (need[id] || 0) + (Number.isInteger(n) ? n : NaN); });
      for (const id in need) {
        const p = prod(st, id);
        if (!(need[id] >= 1)) return err(T('Quantity must be a whole number, at least 1.', "Miqdor butun son va kamida 1 bo'lsin.", 'Количество — целое число не меньше 1.'));
        if (need[id] > p.qty) return err(`${B.label(p)}: ${T('only', 'faqat', 'доступно только')} ${p.qty} ${T('in stock', 'omborda', 'на складе')}.`);
      }
      const date = B.$('#fdate', d).value; if (!date || date > B.fmt.today()) return err(T('Choose a valid date.', "To'g'ri sanani tanlang.", 'Выберите корректную дату.'));
      B.store.update(x => {
        const max = x.sales.reduce((m, s) => Math.max(m, parseInt(s.id.replace(/\D/g, ''), 10) || 0), 1000);
        const items = Object.keys(need).map(id => { const p = prod(x, id); p.qty -= need[id];
          return { productId: id, qty: need[id], price: Math.round(p.sellPrice * (1 - disc / 100) * 100) / 100, cost: p.purchasePrice }; });
        x.sales.push({ id: 'S-' + (max + 1), date, customerId: B.$('#fc', d).value, items, status: B.$('#fs', d).value, discountPct: disc, stockApplied: true });
      });
      d.close(); B.toast(T('Sale saved', 'Sotuv saqlandi', 'Продажа сохранена'));
    };
    d.showModal();
  }

  function invoice(s) {
    const st = B.store.state, d = ensureDialog(), c = cust(st, s.customerId);
    d.innerHTML = `<div id="inv"><h2>${T('Invoice', 'Hisob-faktura', 'Счёт')} ${esc(s.id)}</h2>
      <p class="muted">${esc(st.settings.businessName)} · ${B.fmt.date(s.date)}<br>${T('Customer', 'Mijoz', 'Клиент')}: ${c ? esc(B.label(c)) : '—'}</p>
      <div class="table-wrap"><table class="statement"><thead><tr><th>${T('Item', 'Mahsulot', 'Товар')}</th><th class="num">${T('Qty', 'Miqdor', 'Кол-во')}</th><th class="num">${T('Price', 'Narx', 'Цена')}</th><th class="num">${T('Amount', 'Summa', 'Сумма')}</th></tr></thead><tbody>
      ${s.items.map(it => { const p = prod(st, it.productId); return `<tr><td>${p ? esc(B.label(p)) : esc(it.productId)}</td><td class="num">${it.qty}</td><td class="num">${B.fmt.money(it.price)}</td><td class="num">${B.fmt.money(it.qty * it.price)}</td></tr>`; }).join('')}
      <tr class="total"><td colspan="3">${T('Total', 'Jami', 'Итого')}${s.discountPct ? ` (−${s.discountPct}%)` : ''}</td><td class="num">${B.fmt.money(total(s))}</td></tr></tbody></table></div></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btn-ghost" id="cl" type="button">${T('Close', 'Yopish', 'Закрыть')}</button><button class="btn btn-primary" id="pr" type="button">${T('Print', 'Chop etish', 'Печать')}</button></div>`;
    B.$('#cl', d).onclick = () => d.close();
    B.$('#pr', d).onclick = () => { document.body.classList.add('printing-invoice'); window.print(); };
    window.addEventListener('afterprint', () => document.body.classList.remove('printing-invoice'), { once: true });
    d.showModal();
  }

  B.register({ id: 'sales', title: 'Sales', sub: 'Orders, payments and invoices', icon: 'sales', group: 'Operations', render });
})(window.BOS);
</script>
<script>
/* Inventory, Customers and Suppliers: real CRUD on the existing state. Shared helpers live in B.ui.
 * Money fields are typed in the chosen currency and stored in USD, like the rest of the app. */
(function (B) {
  'use strict';
  const L = B.finance, esc = B.esc;
  const T = (en, uz, ru) => ({ en, uz, ru }[B.i18n.lang()] || en);
  const cur = () => B.store.state.settings.currency;
  const toUSD = v => Math.round(v / B.fmt.rate() * 1e4) / 1e4;
  const fromUSD = v => Math.round(v * B.fmt.rate() * 100) / 100;
  const num = s => Number(String(s).replace(',', '.'));
  const C = { cancel: T('Cancel', 'Bekor qilish', 'Отмена'), save: T('Save', 'Saqlash', 'Сохранить'), del: T('Delete', "O'chirish", 'Удалить'), edit: T('Edit', 'Tahrirlash', 'Изменить'), search: T('Search…', 'Izlash…', 'Поиск…') };

  let dlg;
  const modal = html => {
    if (!dlg) { dlg = document.createElement('dialog'); dlg.className = 'card'; dlg.style.cssText = 'width:min(560px,94vw);max-height:90vh;overflow:auto;padding:20px'; dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); }); document.body.appendChild(dlg); }
    dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); return dlg;
  };
  const form = (title, fields, onSave) => {
    const d = modal(`<h2>${title}</h2><div style="display:grid;gap:12px;margin-top:12px">${fields.map(f => `<label class="field">${f.label}${f.opts
      ? `<select data-k="${f.k}">${f.opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(f.val) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`
      : `<input data-k="${f.k}" type="${f.type || 'text'}" ${f.step ? `step="${f.step}"` : ''} value="${esc(f.val ?? '')}">`}</label>`).join('')}
      <p id="err" role="alert" style="color:var(--bad);font-weight:600"></p>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" id="x" type="button">${C.cancel}</button><button class="btn btn-primary" id="ok" type="button">${C.save}</button></div></div>`);
    d.querySelector('#x').onclick = () => d.close();
    d.querySelector('#ok').onclick = () => { const v = {}; d.querySelectorAll('[data-k]').forEach(e => { v[e.dataset.k] = e.value.trim(); }); const m = onSave(v); if (m) d.querySelector('#err').textContent = m; else d.close(); };
  };
  const confirm = (msg, onYes) => {
    const d = modal(`<h2>${C.del}?</h2><p class="muted" style="margin:8px 0 16px">${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" id="x" type="button">${C.cancel}</button><button class="btn btn-danger" id="ok" type="button">${C.del}</button></div>`);
    d.querySelector('#x').onclick = () => d.close(); d.querySelector('#ok').onclick = () => { d.close(); onYes(); };
  };
  const info = (title, msg) => { const d = modal(`<h2>${title}</h2><p class="muted" style="margin:8px 0 16px">${esc(msg)}</p><div style="text-align:right"><button class="btn btn-primary" id="x" type="button">OK</button></div>`); d.querySelector('#x').onclick = () => d.close(); };
  const required = (v, ...keys) => keys.some(k => !v[k]) ? T('Please fill in the required fields.', "Majburiy maydonlarni to'ldiring.", 'Заполните обязательные поля.') : '';
  B.ui = { modal, form, confirm, info, T };

  // A page with a search box, an "add" button and a table. cfg.rows(st) -> [{cells, id}]
  function page(cfg) {
    let q = '', extra = cfg.extra ? cfg.extra.init : '';
    const draw = root => {
      const st = B.store.state, all = cfg.rows(st, extra), rows = all.filter(r => !q || r.text.toLowerCase().includes(q.toLowerCase()));
      root.innerHTML = `<section class="card"><div class="view-tools" style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
        <input id="q" type="search" placeholder="${esc(C.search)}" value="${esc(q)}" style="flex:1;min-width:140px">
        ${cfg.extra ? `<select id="ex">${cfg.extra.opts.map(([v, l]) => `<option value="${v}" ${v === extra ? 'selected' : ''}>${l}</option>`).join('')}</select>` : ''}
        <button class="btn btn-primary" id="add" type="button">${B.icon(cfg.icon)}${cfg.addLabel}</button></div>
        ${cfg.summary ? `<p class="muted" style="margin-bottom:10px">${cfg.summary(st)}</p>` : ''}
        ${rows.length ? `<div class="table-wrap"><table class="statement"><thead><tr>${cfg.heads.map((h, i) => `<th class="${cfg.numCols.includes(i) ? 'num' : ''}">${h}</th>`).join('')}<th></th></tr></thead><tbody>
        ${rows.map(r => `<tr>${r.cells.map((c, i) => `<td class="${cfg.numCols.includes(i) ? 'num' : ''}">${c}</td>`).join('')}<td class="num">${cfg.actions.map(([k, l, cls]) => `<button class="btn ${cls || 'btn-ghost'}" data-a="${k}" data-id="${r.id}" type="button">${l}</button>`).join(' ')}</td></tr>`).join('')}
        </tbody></table></div>` : `<p class="muted">${T('Nothing found.', 'Hech narsa topilmadi.', 'Ничего не найдено.')}</p>`}</section>`;
      const qi = B.$('#q', root);
      qi.addEventListener('input', e => { q = e.target.value; const p = e.target.selectionStart; draw(root); const n = B.$('#q', root); n.focus(); n.setSelectionRange(p, p); });
      if (cfg.extra) B.$('#ex', root).addEventListener('change', e => { extra = e.target.value; draw(root); });
      B.$('#add', root).addEventListener('click', () => cfg.onAdd());
      root.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => cfg.onAction(b.dataset.a, b.dataset.id)));
    };
    return draw;
  }
  const sold = (st, pid) => st.sales.some(s => s.items.some(i => i.productId === pid));
  const nextId = (arr, p) => p + (arr.reduce((m, x) => Math.max(m, parseInt(String(x.id).replace(/\D/g, ''), 10) || 0), 0) + 1);

  /* ---------- Inventory ---------- */
  const productFields = (p, st) => [
    { k: 'name', label: T('Name', 'Nomi', 'Название') + ' *', val: p.name },
    { k: 'sku', label: 'SKU *', val: p.sku },
    { k: 'category', label: T('Category', 'Kategoriya', 'Категория'), val: p.category },
    { k: 'cost', label: `${T('Purchase price', 'Xarid narxi', 'Закупочная цена')} (${cur()})`, type: 'number', step: 'any', val: p.purchasePrice !== undefined ? fromUSD(p.purchasePrice) : '' },
    { k: 'price', label: `${T('Selling price', 'Sotuv narxi', 'Цена продажи')} (${cur()})`, type: 'number', step: 'any', val: p.sellPrice !== undefined ? fromUSD(p.sellPrice) : '' },
    { k: 'reorder', label: T('Minimum stock', 'Minimal zaxira', 'Мин. остаток'), type: 'number', val: p.reorderLevel ?? 0 },
    { k: 'supplier', label: T('Supplier', 'Yetkazib beruvchi', 'Поставщик'), val: p.supplierId, opts: st.suppliers.map(s => [s.id, s.name]) }
  ];
  const checkProduct = (v, st, selfId) => {
    const m = required(v, 'name', 'sku'); if (m) return m;
    if (st.products.some(p => p.sku.toLowerCase() === v.sku.toLowerCase() && p.id !== selfId)) return T('This SKU already exists.', 'Bu SKU mavjud.', 'Такой SKU уже существует.');
    const c = num(v.cost), pr = num(v.price), r = num(v.reorder);
    if (!(c >= 0) || !(pr >= 0) || !(r >= 0) || !Number.isInteger(r)) return T('Prices must be 0 or more; minimum stock a whole number.', "Narxlar 0 dan kam bo'lmasin; minimal zaxira butun son.", 'Цены не меньше 0; мин. остаток — целое число.');
    return '';
  };
  const move = (x, pid, delta, reason) => { (x.stockMoves = x.stockMoves || []).push({ id: B.uid('M'), date: B.fmt.today(), productId: pid, delta, reason }); };

  let draw;
  B.register({ id: 'inventory', title: 'Inventory', sub: 'Stock levels and reorder alerts', icon: 'inventory', group: 'Operations', render(root) {
    if (!draw) draw = page({
      icon: 'inventory', addLabel: T('New product', 'Yangi mahsulot', 'Новый товар'),
      heads: ['SKU', T('Product', 'Mahsulot', 'Товар'), T('Category', 'Kategoriya', 'Категория'), T('Stock', 'Qoldiq', 'Остаток'), T('Min', 'Min', 'Мин'), T('Cost', 'Narx', 'Себест.'), T('Value', 'Qiymat', 'Стоимость'), T('Status', 'Holat', 'Статус')],
      numCols: [3, 4, 5, 6],
      extra: { init: 'all', opts: [['all', T('All', 'Hammasi', 'Все')], ['low', T('Low stock', 'Kam qolgan', 'Мало на складе')]] },
      summary: st => `${T('Inventory value', 'Ombor qiymati', 'Стоимость склада')}: <b>${B.fmt.money(st.products.reduce((a, p) => a + p.qty * p.purchasePrice, 0))}</b> · ${T('Low stock', 'Kam qolgan', 'Мало на складе')}: <b>${L.lowStock(st).length}</b>`,
      rows: (st, ex) => st.products.filter(p => ex !== 'low' || p.qty <= p.reorderLevel).map(p => ({ id: p.id, text: `${p.name} ${p.sku} ${p.category} ${B.label(p)}`,
        cells: [esc(p.sku), esc(B.label(p)), esc(p.category || ''), B.fmt.num(p.qty), B.fmt.num(p.reorderLevel), B.fmt.money(p.purchasePrice), B.fmt.money(p.qty * p.purchasePrice),
          `<span class="tag ${p.qty <= 0 ? 'tag-bad' : p.qty <= p.reorderLevel ? 'tag-warn' : 'tag-good'}">${p.qty <= 0 ? T('Out', 'Tugagan', 'Нет') : p.qty <= p.reorderLevel ? T('Reorder', 'Buyurtma', 'Заказать') : 'OK'}</span>`] })),
      actions: [['adj', T('Adjust', 'Tuzatish', 'Корректировка')], ['edit', C.edit], ['del', '✕', 'btn-danger']],
      onAdd() {
        const st = B.store.state, f = productFields({}, st).concat([{ k: 'qty', label: T('Opening stock', 'Boshlang\'ich qoldiq', 'Начальный остаток'), type: 'number', val: 0 }]);
        form(T('New product', 'Yangi mahsulot', 'Новый товар'), f, v => {
          const m = checkProduct(v, st); if (m) return m; const q0 = num(v.qty); if (!(q0 >= 0) || !Number.isInteger(q0)) return T('Opening stock must be a whole number ≥ 0.', "Qoldiq butun son bo'lsin (≥ 0).", 'Остаток — целое число ≥ 0.');
          B.store.update(x => { const id = nextId(x.products, 'p'); x.products.push({ id, sku: v.sku, name: v.name, category: v.category, purchasePrice: toUSD(num(v.cost)), sellPrice: toUSD(num(v.price)), qty: q0, reorderLevel: num(v.reorder), supplierId: v.supplier }); if (q0) move(x, id, q0, 'opening'); });
          B.toast(T('Product added', "Mahsulot qo'shildi", 'Товар добавлен'));
        });
      },
      onAction(a, id) {
        const st = B.store.state, p = st.products.find(x => x.id === id); if (!p) return;
        if (a === 'edit') form(C.edit + ': ' + B.label(p), productFields(p, st), v => { const m = checkProduct(v, st, id); if (m) return m;
          B.store.update(x => { Object.assign(x.products.find(y => y.id === id), { name: v.name, sku: v.sku, category: v.category, purchasePrice: toUSD(num(v.cost)), sellPrice: toUSD(num(v.price)), reorderLevel: num(v.reorder), supplierId: v.supplier }); delete x.products.find(y => y.id === id).i18n; });
          B.toast(T('Saved. Past sales keep their original prices.', "Saqlandi. Oldingi sotuvlar narxi o'zgarmaydi.", 'Сохранено. Прошлые продажи сохраняют старые цены.')); });
        if (a === 'adj') {
          const hist = (st.stockMoves || []).filter(m => m.productId === id).slice(-5).reverse().map(m => `${B.fmt.date(m.date)}: ${m.delta > 0 ? '+' : ''}${m.delta} (${esc(m.reason)})`).join(' · ');
          form(`${T('Adjust stock', 'Qoldiqni tuzatish', 'Корректировка')}: ${B.label(p)} (${p.qty})`, [
            { k: 'd', label: T('Change (+ add, − remove)', "O'zgarish (+ qo'shish, − ayirish)", 'Изменение (+ приход, − расход)'), type: 'number', val: 0 },
            { k: 'r', label: T('Reason', 'Sabab', 'Причина'), val: 'purchase', opts: [['purchase', T('Purchase / restock', 'Xarid', 'Закупка')], ['return', T('Return', 'Qaytarish', 'Возврат')], ['loss', T('Loss / damage', "Yo'qotish", 'Потеря/брак')], ['count', T('Stock count', 'Inventarizatsiya', 'Инвентаризация')]] }
          ], v => { const d = num(v.d);
            if (!Number.isInteger(d) || d === 0) return T('Enter a non-zero whole number.', "Nolga teng bo'lmagan butun son kiriting.", 'Введите ненулевое целое число.');
            if (p.qty + d < 0) return T('Stock cannot go below zero.', "Qoldiq noldan kam bo'lishi mumkin emas.", 'Остаток не может быть отрицательным.');
            B.store.update(x => { x.products.find(y => y.id === id).qty += d; move(x, id, d, v.r); }); B.toast(T('Stock updated', 'Qoldiq yangilandi', 'Остаток обновлён')); });
          if (hist) dlg.querySelector('h2').insertAdjacentHTML('afterend', `<p class="muted" style="font-size:12.5px;margin-top:6px">${hist}</p>`);
        }
        if (a === 'del') { if (sold(st, id)) return info(T("Can't delete", "O'chirib bo'lmaydi", 'Нельзя удалить'), T('This product appears in sales. Set its stock to 0 instead.', "Bu mahsulot sotuvlarda bor. Qoldiqni 0 qiling.", 'Товар есть в продажах. Обнулите остаток.'));
          confirm(B.label(p), () => { B.store.update(x => { x.products = x.products.filter(y => y.id !== id); }); B.toast(T('Product deleted', "Mahsulot o'chirildi", 'Товар удалён')); }); }
      }
    });
    draw(root);
  } });

  /* ---------- Customers & Suppliers ---------- */
  const partyFields = (o, sup) => [
    { k: 'name', label: T('Name', 'Nomi', 'Название') + ' *', val: o.name ? B.label(o) : '' },
    ...(sup ? [{ k: 'contact', label: T('Contact person', 'Aloqa shaxsi', 'Контактное лицо'), val: o.contact }, { k: 'lead', label: T('Lead time (days)', 'Yetkazish muddati (kun)', 'Срок поставки (дни)'), type: 'number', val: o.leadDays ?? 7 }] : []),
    { k: 'email', label: 'Email', type: 'email', val: o.email }, { k: 'phone', label: T('Phone', 'Telefon', 'Телефон'), val: o.phone },
    { k: 'notes', label: T('Notes', 'Izohlar', 'Заметки'), val: o.notes }
  ];
  const party = (key, sup) => {
    const idp = sup ? 's' : 'c', label = sup ? T('New supplier', 'Yangi yetkazib beruvchi', 'Новый поставщик') : T('New customer', 'Yangi mijoz', 'Новый клиент');
    const stat = (st, id) => {
      if (sup) { const ps = st.purchases.filter(p => p.supplierId === id); return { n: ps.length, amt: ps.reduce((a, p) => a + p.qty * p.unitCost, 0), owed: ps.filter(p => !p.paid).reduce((a, p) => a + p.qty * p.unitCost, 0), used: ps.length || st.products.some(p => p.supplierId === id) }; }
      const ss = st.sales.filter(s => s.customerId === id); return { n: ss.length, amt: ss.reduce((a, s) => a + L.saleTotal(s), 0), owed: ss.filter(s => s.status === 'unpaid').reduce((a, s) => a + L.saleTotal(s), 0), used: ss.length > 0 };
    };
    let draw;
    B.register({ id: key, title: sup ? 'Suppliers' : 'Customers', sub: sup ? 'Who you buy from' : 'Your clients and their orders', icon: key, group: 'Relationships', render(root) {
      if (!draw) draw = page({
        icon: key, addLabel: label, numCols: sup ? [3, 4, 5] : [2, 3, 4],
        heads: sup ? [T('Supplier', 'Yetkazib beruvchi', 'Поставщик'), T('Contact', 'Aloqa', 'Контакт'), T('Phone', 'Telefon', 'Телефон'), T('Lead days', 'Kun', 'Дни'), T('Purchased', 'Xarid', 'Закуплено'), T('We owe', 'Qarzimiz', 'Мы должны')]
          : [T('Customer', 'Mijoz', 'Клиент'), T('Phone', 'Telefon', 'Телефон'), T('Orders', 'Buyurtmalar', 'Заказы'), T('Total spent', 'Jami xarid', 'Всего куплено'), T('Owes you', 'Qarzi', 'Должен вам')],
        summary: st => sup ? `${T('Total owed to suppliers', 'Yetkazib beruvchilarga qarz', 'Долг поставщикам')}: <b>${B.fmt.money(st.suppliers.reduce((a, s) => a + stat(st, s.id).owed, 0))}</b>` : `${T('Total owed by customers', 'Mijozlar qarzi', 'Долг клиентов')}: <b>${B.fmt.money(st.customers.reduce((a, c) => a + stat(st, c.id).owed, 0))}</b>`,
        rows: st => st[key].map(o => { const s = stat(st, o.id); return { id: o.id, text: `${o.name} ${B.label(o)} ${o.email || ''} ${o.phone || ''} ${o.contact || ''}`,
          cells: sup ? [esc(o.name), esc(o.contact || ''), esc(o.phone || ''), o.leadDays ?? '', B.fmt.money(s.amt), B.fmt.money(s.owed)] : [esc(B.label(o)), esc(o.phone || ''), s.n, B.fmt.money(s.amt), s.owed ? `<span class="tag tag-warn">${B.fmt.money(s.owed)}</span>` : '—'] }; }),
        actions: [...(sup ? [] : [['hist', T('History', 'Tarix', 'История')]]), ['edit', C.edit], ['del', '✕', 'btn-danger']],
        onAdd() { form(label, partyFields({}, sup), v => { const m = required(v, 'name'); if (m) return m;
          B.store.update(x => { x[key].push({ id: nextId(x[key], idp), name: v.name, contact: v.contact || '', leadDays: sup ? num(v.lead) || 0 : undefined, email: v.email, phone: v.phone, notes: v.notes }); }); B.toast(T('Added', "Qo'shildi", 'Добавлено')); }); },
        onAction(a, id) {
          const st = B.store.state, o = st[key].find(x => x.id === id); if (!o) return;
          if (a === 'edit') form(C.edit + ': ' + B.label(o), partyFields(o, sup), v => { const m = required(v, 'name'); if (m) return m;
            B.store.update(x => { const t = x[key].find(y => y.id === id); Object.assign(t, { name: v.name, email: v.email, phone: v.phone, notes: v.notes }); delete t.i18n; if (sup) Object.assign(t, { contact: v.contact, leadDays: num(v.lead) || 0 }); }); B.toast(T('Saved', 'Saqlandi', 'Сохранено')); });
          if (a === 'hist') { const ss = st.sales.filter(s => s.customerId === id).sort((p, q) => q.date.localeCompare(p.date)).slice(0, 15);
            const d = modal(`<h2>${esc(B.label(o))}</h2>${o.notes ? `<p class="muted">${esc(o.notes)}</p>` : ''}<div class="table-wrap"><table class="statement"><tbody>${ss.map(s => `<tr><td>${esc(s.id)}</td><td>${B.fmt.date(s.date)}</td><td class="num">${B.fmt.money(L.saleTotal(s))}</td><td><span class="tag ${s.status === 'paid' ? 'tag-good' : 'tag-warn'}">${s.status === 'paid' ? T('Paid', "To'langan", 'Оплачено') : T('Unpaid', "To'lanmagan", 'Не оплачено')}</span></td></tr>`).join('') || `<tr><td>${T('No sales yet.', "Sotuvlar yo'q.", 'Продаж пока нет.')}</td></tr>`}</tbody></table></div><div style="text-align:right;margin-top:12px"><button class="btn btn-primary" id="x" type="button">OK</button></div>`); d.querySelector('#x').onclick = () => d.close(); }
          if (a === 'del') { if (stat(st, id).used) return info(T("Can't delete", "O'chirib bo'lmaydi", 'Нельзя удалить'), T('This record is linked to existing sales, purchases or products.', "Bu yozuv sotuv, xarid yoki mahsulotlarga bog'langan.", 'Запись связана с продажами, закупками или товарами.'));
            confirm(B.label(o), () => { B.store.update(x => { x[key] = x[key].filter(y => y.id !== id); }); B.toast(T('Deleted', "O'chirildi", 'Удалено')); }); }
        }
      });
      draw(root);
    } });
  };
  party('customers', false); party('suppliers', true);
})(window.BOS);
</script>
