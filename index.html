<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* Design tokens, reset, typography. Dark theme = same tokens, new values. */
:root {
  --ink: #10201e; --ink-2: #1a2d2a; --ink-text: #b9c6c2;
  --paper: #f4f5f2; --card: #ffffff; --line: #e3e6e1;
  --text: #16211f; --muted: #66726f;
  --brand: #0f766e; --brand-soft: #e1f1ee;
  --bad: #d9573b; --bad-soft: #fbe9e4;
  --warn: #a8690f; --warn-soft: #fbf0d9;
  --radius: 14px; --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(16, 32, 30, .05);
  --sidebar-w: 248px;
  font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
[data-theme="dark"] {
  --ink: #0a1211; --ink-2: #15221f;
  --paper: #0e1615; --card: #152120; --line: #243431;
  --text: #e8efed; --muted: #8fa09c;
  --brand: #19a396; --brand-soft: #143a36;
  --bad: #ef7a60; --bad-soft: #3a201a;
  --warn: #e3b04b; --warn-soft: #352a12;
  --shadow: none; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--text); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, dl, dd, ul { margin: 0; padding: 0; }
ul { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }

</style>
  <style>
/* App shell: sidebar, topbar, content grid, responsive breakpoints. */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }
.main { min-width: 0; }
.topbar { max-width: 1320px; margin: 0 auto; padding: 26px 32px 18px; display: flex; align-items: center; gap: 14px; }
.page-head h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
.page-head p { color: var(--muted); }
.content { max-width: 1320px; margin: 0 auto; padding: 4px 32px 48px; display: grid; gap: 20px; outline: none; }
.menu-btn { display: none; }

.sidebar { position: sticky; top: 0; height: 100vh; background: var(--ink); color: var(--ink-text); display: flex; flex-direction: column; padding: 22px 14px 16px; z-index: 30; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 20px; color: #fff; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; font-weight: 800; }
.brand-name { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.nav { flex: 1; overflow-y: auto; display: grid; gap: 3px; align-content: start; }
.nav-group { margin: 16px 12px 4px; font-size: 12px; font-weight: 600; color: #7e8e8a; }
.nav-group:first-child { margin-top: 0; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); font-weight: 600; transition: background .15s, color .15s; }
.nav-item:hover { background: var(--ink-2); color: #fff; }
.nav-item.is-active { background: var(--brand); color: #fff; }
.workspace { display: flex; align-items: center; gap: 10px; padding: 12px 10px 0; border-top: 1px solid var(--ink-2); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: #e8b04a; color: #10201e; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.workspace-name { color: #fff; font-weight: 700; font-size: 13.5px; line-height: 1.2; }
.workspace-meta { font-size: 12px; color: #7e8e8a; }
.scrim { display: none; }

.grid-kpi { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid-main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; }
.grid-three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }

@media (max-width: 1180px) {
  .grid-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-main, .grid-three { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w); transform: translateX(-100%); transition: transform .22s ease; }
  .sidebar.is-open { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; background: rgba(16, 32, 30, .45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .scrim.is-visible { opacity: 1; pointer-events: auto; }
  .menu-btn { display: grid; }
  .topbar { padding: 18px 18px 14px; }
  .content { padding: 4px 18px 40px; }
}
@media (max-width: 640px) { .grid-kpi { grid-template-columns: minmax(0, 1fr); } }

</style>
  <style>
/* Reusable UI parts: cards, KPIs, buttons, forms, tables, lists, tags, toast. */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.card-head { margin-bottom: 14px; }
.card h2 { font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
.card-sub { color: var(--muted); font-size: 13px; }

.view-tools { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: var(--radius-sm); border: 1px solid transparent; font-weight: 700; }
.btn-primary { background: var(--brand); color: #fff; }
.btn-ghost { background: var(--card); border-color: var(--line); }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); }
select, input[type="text"] { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); }
.view-tools select { width: auto; font-weight: 600; }

.kpi { padding: 20px 22px; }
.kpi-label { color: var(--muted); font-weight: 600; font-size: 13.5px; }
.kpi-value { font-size: 29px; font-weight: 800; letter-spacing: -.03em; line-height: 1.2; margin: 5px 0 2px; font-variant-numeric: tabular-nums; }
.kpi-caption { color: var(--muted); font-size: 12.5px; }
.kpi-delta { margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.kpi-delta.is-good { color: var(--brand); }
.kpi-delta.is-bad { color: var(--bad); }

.chart-box { position: relative; height: 290px; }
.chart-box.is-small { height: 260px; }

.row-list { display: grid; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.row-title { font-weight: 700; }
.row-sub { color: var(--muted); font-size: 12.5px; }
.row-value { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }

.tag { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--paper); font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.tag-good { background: var(--brand-soft); color: var(--brand); }
.tag-warn { background: var(--warn-soft); color: var(--warn); }
.tag-bad { background: var(--bad-soft); color: var(--bad); }

.table-wrap { overflow-x: auto; margin: 0 -8px; }
table { width: 100%; border-collapse: collapse; min-width: 520px; }
th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); }
td { padding: 12px 8px; border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.num { font-weight: 800; }

.empty-inline { color: var(--muted); padding: 18px 0; }
.empty-state { text-align: center; padding: 48px 20px; display: grid; gap: 10px; justify-items: center; }
.empty-state svg { width: 34px; height: 34px; color: var(--brand); }
.empty-state p { color: var(--muted); max-width: 52ch; }
.planned { text-align: left; color: var(--muted); display: grid; gap: 4px; margin: 4px 0; }
.planned li::before { content: '–'; margin-right: 8px; }
.stub-data { font-weight: 700; color: var(--brand); }

.form { display: grid; gap: 18px; max-width: 520px; }
.field { display: grid; gap: 6px; font-weight: 700; font-size: 13.5px; }
.field input, .field select { font-weight: 500; }
.field small { color: var(--muted); font-weight: 500; }
.field .error { color: var(--bad); font-weight: 600; }
.seg { display: inline-flex; padding: 3px; background: var(--paper); border-radius: var(--radius-sm); width: fit-content; }
.seg button { border: 0; background: none; padding: 6px 16px; border-radius: 7px; font-weight: 700; color: var(--muted); }
.seg button.is-active { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.settings-block { display: grid; gap: 16px; }
.settings-block + .settings-block { border-top: 1px solid var(--line); padding-top: 22px; margin-top: 22px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100; }
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

</style>

<!-- Load order matters: core → data → components → modules → main -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
/* Shared helpers. Everything in the app hangs off one global namespace: BOS. */
window.BOS = window.BOS || {};
(function (B) {
  'use strict';
  const pad = n => String(n).padStart(2, '0');

  B.$ = (sel, root = document) => root.querySelector(sel);
  B.$$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  B.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  B.css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  B.uid = prefix => prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  const currency = () => (B.store && B.store.state && B.store.state.settings.currency) || 'USD';
  const digits = () => (currency() === 'UZS' ? 0 : 2);

  B.fmt = {
    iso: d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
    today: () => B.fmt.iso(new Date()),
    money: n => new Intl.NumberFormat('en-US', { style: 'currency', currency: currency(), minimumFractionDigits: 0, maximumFractionDigits: digits() }).format(n),
    compact: n => new Intl.NumberFormat('en-US', { style: 'currency', currency: currency(), notation: 'compact', maximumFractionDigits: 1 }).format(n),
    pct: n => `${n.toFixed(1)}%`,
    num: n => new Intl.NumberFormat('en-US').format(n),
    date: iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
    month: d => d.toLocaleDateString('en-US', { month: 'short' })
  };
})(window.BOS);

</script>
<script>
/* Demo data generator. Seeded, so every reset gives the same realistic business. */
(function (B) {
  'use strict';
  const rng = seed => () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  const SUPPLIERS = [
    { id: 's1', name: 'Highland Green Traders', contact: 'Marta Velez', email: 'orders@highlandgreen.example', phone: '+1 555 0141', leadDays: 9 },
    { id: 's2', name: 'Meadow Plant Foods', contact: 'Dan Okafor', email: 'sales@meadowplant.example', phone: '+1 555 0172', leadDays: 3 },
    { id: 's3', name: 'Craft Ware Imports', contact: 'Lina Hartmann', email: 'hello@craftware.example', phone: '+1 555 0113', leadDays: 14 },
    { id: 's4', name: 'Brewtech Equipment', contact: 'Sam Ito', email: 'trade@brewtech.example', phone: '+1 555 0199', leadDays: 12 }
  ];

  // lot = typical units per sale line. qty = current stock on hand.
  const PRODUCTS = [
    { id: 'p1', sku: 'COF-ETH-1K', name: 'Ethiopia Yirgacheffe 1kg', category: 'Coffee', purchasePrice: 14.5, sellPrice: 26, qty: 210, reorderLevel: 160, supplierId: 's1', lot: [8, 24] },
    { id: 'p2', sku: 'COF-COL-1K', name: 'Colombia Supremo 1kg', category: 'Coffee', purchasePrice: 13.2, sellPrice: 24.5, qty: 70, reorderLevel: 150, supplierId: 's1', lot: [8, 22] },
    { id: 'p3', sku: 'COF-ESP-1K', name: 'House Espresso Blend 1kg', category: 'Coffee', purchasePrice: 11.8, sellPrice: 22, qty: 320, reorderLevel: 200, supplierId: 's1', lot: [10, 30] },
    { id: 'p4', sku: 'COF-DEC-500', name: 'Decaf Swiss Water 500g', category: 'Coffee', purchasePrice: 8.4, sellPrice: 16, qty: 40, reorderLevel: 80, supplierId: 's1', lot: [4, 14] },
    { id: 'p5', sku: 'MLK-OAT-1L', name: 'Oat Milk 1L', category: 'Dairy alternatives', purchasePrice: 1.9, sellPrice: 3.6, qty: 900, reorderLevel: 500, supplierId: 's2', lot: [30, 90] },
    { id: 'p6', sku: 'ACC-V60-100', name: 'V60 Paper Filters (100)', category: 'Accessories', purchasePrice: 3.2, sellPrice: 7.5, qty: 380, reorderLevel: 200, supplierId: 's3', lot: [10, 40] },
    { id: 'p7', sku: 'WAR-MUG-01', name: 'Ceramic Mug', category: 'Merchandise', purchasePrice: 4.6, sellPrice: 12, qty: 55, reorderLevel: 160, supplierId: 's3', lot: [8, 30] },
    { id: 'p8', sku: 'WAR-CUP-02', name: 'Reusable Travel Cup', category: 'Merchandise', purchasePrice: 6.1, sellPrice: 16, qty: 190, reorderLevel: 110, supplierId: 's3', lot: [6, 20] },
    { id: 'p9', sku: 'EQP-GRN-01', name: 'Hand Grinder', category: 'Equipment', purchasePrice: 27, sellPrice: 59, qty: 60, reorderLevel: 35, supplierId: 's4', lot: [2, 6] },
    { id: 'p10', sku: 'EQP-KET-01', name: 'Gooseneck Kettle', category: 'Equipment', purchasePrice: 34, sellPrice: 79, qty: 14, reorderLevel: 25, supplierId: 's4', lot: [1, 5] }
  ];

  const CUSTOMERS = [
    { id: 'c1', name: 'Cedar & Oak Café', email: 'buy@cedaroak.example', phone: '+1 555 0201' },
    { id: 'c2', name: 'Harbor Bakery', email: 'office@harborbakery.example', phone: '+1 555 0202' },
    { id: 'c3', name: 'Lumen Co-working', email: 'ops@lumen.example', phone: '+1 555 0203' },
    { id: 'c4', name: 'Pine Street Hotel', email: 'purchasing@pinestreet.example', phone: '+1 555 0204' },
    { id: 'c5', name: 'Maple Grocers', email: 'orders@maplegrocers.example', phone: '+1 555 0205' },
    { id: 'c6', name: 'Riverside Diner', email: 'hi@riversidediner.example', phone: '+1 555 0206' },
    { id: 'c7', name: 'Atlas Events', email: 'events@atlas.example', phone: '+1 555 0207' },
    { id: 'c8', name: 'Walk-in customer', email: '', phone: '' }
  ];

  function generate() {
    const rand = rng(2026);
    const between = (a, b) => a + rand() * (b - a);
    const pick = arr => arr[Math.floor(rand() * arr.length)];
    const now = new Date();
    const iso = B.fmt.iso;
    const products = PRODUCTS.map(p => ({ ...p }));
    const sales = [], expenses = [], purchases = [];
    let saleNo = 1001;

    for (let back = 11; back >= 0; back--) {
      const first = new Date(now.getFullYear(), now.getMonth() - back, 1);
      const lastDay = back === 0 ? now.getDate() : new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
      const growth = 1 + (11 - back) * 0.025;
      const at = day => iso(new Date(first.getFullYear(), first.getMonth(), day));
      const sold = {};

      const count = Math.round(between(34, 44) * growth * (lastDay / (back === 0 ? 30 : lastDay)));
      for (let i = 0; i < count; i++) {
        const day = 1 + Math.floor(rand() * lastDay);
        const lines = [];
        const chosen = new Set();
        const lineCount = 1 + Math.floor(rand() * 3);
        while (chosen.size < lineCount) chosen.add(pick(products));
        chosen.forEach(p => {
          const qty = Math.max(1, Math.round(between(p.lot[0], p.lot[1]) * growth));
          lines.push({ productId: p.id, qty, price: p.sellPrice, cost: p.purchasePrice });
          sold[p.id] = (sold[p.id] || 0) + qty;
        });
        const ageDays = (now - new Date(first.getFullYear(), first.getMonth(), day)) / 864e5;
        const paid = ageDays > 25 ? rand() < .97 : rand() < .72;
        sales.push({ id: 'S-' + saleNo++, date: at(day), customerId: pick(CUSTOMERS).id, items: lines, status: paid ? 'paid' : 'unpaid' });
      }

      // Supplier purchases roughly replace what was sold (cash goes out when stock is bought).
      if (lastDay >= 2) {
        products.forEach(p => {
          if (sold[p.id]) purchases.push({ id: `PO-${back}-${p.id}`, date: at(2), supplierId: p.supplierId, productId: p.id, qty: Math.ceil(sold[p.id] * 1.02), unitCost: p.purchasePrice, paid: true });
        });
      }

      const exp = (day, category, description, amount) => {
        if (day <= lastDay) expenses.push({ id: `E-${back}-${category}`, date: at(day), category, description, amount: Math.round(amount), paid: true });
      };
      exp(1, 'Rent', 'Shop and storage rent', 2200);
      exp(28, 'Salaries', 'Team salaries', 5600 + (11 - back) * 60);
      exp(10, 'Marketing', 'Ads and promotions', between(650, 1050));
      exp(15, 'Utilities', 'Power, water, internet', between(250, 380));
      exp(3, 'Software', 'Subscriptions', 150);
      exp(5, 'Insurance', 'Business insurance', 120);
    }

    return {
      version: 1,
      settings: { ownerName: 'Zokirov Abror', businessName: 'Northbound Coffee Co.', currency: 'USD', theme: 'light' },
      products, customers: CUSTOMERS.map(c => ({ ...c })), suppliers: SUPPLIERS.map(s => ({ ...s })),
      sales, expenses, purchases
    };
  }

  B.demo = { generate };
})(window.BOS);

</script>
<script>
/* Single source of truth. Modules read B.store.state and change it only through update(). */
(function (B) {
  'use strict';
  const KEY = 'businessos.v2';
  const listeners = new Set();

  B.store = {
    state: null,

    load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const saved = JSON.parse(raw);
          if (saved && saved.version === 1 && Array.isArray(saved.sales)) { this.state = saved; return; }
        }
      } catch (err) { /* corrupted data: fall back to demo data */ }
      this.state = B.demo.generate();
      this.save();
    },

    save() {
      try { localStorage.setItem(KEY, JSON.stringify(this.state)); }
      catch (err) { B.toast && B.toast('Storage is full or blocked. Changes will not be saved.'); }
    },

    // update(state => { ...mutate... }) saves and notifies every listener.
    update(mutator) { mutator(this.state); this.save(); listeners.forEach(fn => fn(this.state)); },
    reset() { this.state = B.demo.generate(); this.save(); listeners.forEach(fn => fn(this.state)); },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  };
})(window.BOS);

</script>
<script>
/* Financial formulas. Pure functions: state in, numbers out. No DOM here.
 *
 *  Revenue            = value of sales made in the period (paid or not)
 *  COGS               = quantity sold × purchase cost at time of sale
 *  Gross Profit       = Revenue − COGS
 *  Total Expenses     = COGS + operating expenses (rent, salaries, marketing, ...)
 *  Net Profit         = Revenue − Total Expenses  (= Gross Profit − operating expenses)
 *  Profit Margin      = Net Profit ÷ Revenue × 100
 *  Cash Flow          = actual cash received (paid sales) − actual cash paid out (paid expenses + paid stock purchases)
 *  Inventory Value    = quantity on hand × purchase price
 *
 * Revenue, profit and cash flow differ on purpose: an unpaid sale is revenue but not cash,
 * and a stock purchase is cash out but not an expense until the goods are sold (COGS).
 */
(function (B) {
  'use strict';
  const sum = (arr, fn) => arr.reduce((s, x) => s + fn(x), 0);
  const saleTotal = s => sum(s.items, i => i.qty * i.price);
  const saleCost = s => sum(s.items, i => i.qty * i.cost);
  const between = (d, from, to) => d >= from && d <= to;

  const F = {
    saleTotal, saleCost,

    // Current period of N months (calendar months incl. this one) and the equal period before it.
    range(months, now = new Date()) {
      const y = now.getFullYear(), m = now.getMonth(), iso = B.fmt.iso;
      return {
        from: iso(new Date(y, m - (months - 1), 1)), to: iso(now),
        prevFrom: iso(new Date(y, m - (2 * months - 1), 1)), prevTo: iso(new Date(y, m - (months - 1), 0))
      };
    },

    summary(st, from, to) {
      const sales = st.sales.filter(s => between(s.date, from, to));
      const expenses = st.expenses.filter(e => between(e.date, from, to));
      const buys = st.purchases.filter(p => between(p.date, from, to));

      const revenue = sum(sales, saleTotal);
      const cogs = sum(sales, saleCost);
      const opex = sum(expenses, e => e.amount);
      const totalExpenses = cogs + opex;
      const netProfit = revenue - totalExpenses;
      const cashIn = sum(sales.filter(s => s.status === 'paid'), saleTotal);
      const cashOut = sum(expenses.filter(e => e.paid), e => e.amount) + sum(buys.filter(p => p.paid), p => p.qty * p.unitCost);

      return {
        revenue, cogs, grossProfit: revenue - cogs, opex, totalExpenses, netProfit,
        margin: revenue ? (netProfit / revenue) * 100 : 0,
        cashIn, cashOut, cashFlow: cashIn - cashOut,
        receivables: revenue - cashIn, salesCount: sales.length
      };
    },

    change: (cur, prev) => (prev === 0 ? null : ((cur - prev) / Math.abs(prev)) * 100),

    monthly(st, count = 12) {
      const now = new Date(), rows = [];
      for (let i = count - 1; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        rows.push({ label: B.fmt.month(d), ...F.summary(st, key + '-01', key + '-31') });
      }
      return rows;
    },

    inventoryValue: st => sum(st.products, p => p.qty * p.purchasePrice),
    lowStock: st => st.products.filter(p => p.qty <= p.reorderLevel).sort((a, b) => a.qty / a.reorderLevel - b.qty / b.reorderLevel),

    topProducts(st, from, to, limit = 5) {
      const map = {};
      st.sales.filter(s => between(s.date, from, to)).forEach(s => s.items.forEach(i => {
        const row = map[i.productId] || (map[i.productId] = { productId: i.productId, units: 0, revenue: 0 });
        row.units += i.qty; row.revenue += i.qty * i.price;
      }));
      return Object.values(map).sort((a, b) => b.units - a.units).slice(0, limit)
        .map(r => ({ ...r, name: (st.products.find(p => p.id === r.productId) || { name: 'Deleted product' }).name }));
    },

    costBreakdown(st, from, to) {
      const s = F.summary(st, from, to), map = { 'Cost of goods sold': s.cogs };
      st.expenses.filter(e => between(e.date, from, to)).forEach(e => { map[e.category] = (map[e.category] || 0) + e.amount; });
      return Object.entries(map).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    }
  };
  B.finance = F;
})(window.BOS);

</script>

<script>
/* Hash router + sidebar. A module is { id, title, sub, icon, group, render(root), destroy?() }. */
(function (B) {
  'use strict';
  const order = [];
  B.modules = {};
  B.register = mod => { B.modules[mod.id] = mod; order.push(mod.id); };

  B.router = {
    current: null,

    buildNav() {
      let group = '';
      B.$('#nav').innerHTML = order.map(id => {
        const m = B.modules[id];
        const label = m.group !== group ? `<p class="nav-group">${m.group}</p>` : '';
        group = m.group;
        return `${label}<a class="nav-item" href="#/${id}" data-id="${id}">${B.icon(m.icon)}${m.title}</a>`;
      }).join('');
    },

    start() {
      this.buildNav();
      window.addEventListener('hashchange', () => this.go());
      B.store.subscribe(() => this.show(this.current, true));
      this.go();
    },

    go() {
      const id = location.hash.replace('#/', '');
      this.show(B.modules[id] || B.modules[order[0]], false);
    },

    show(mod, isRefresh) {
      if (this.current && this.current.destroy) this.current.destroy();
      this.current = mod;
      B.$$('.nav-item').forEach(a => a.classList.toggle('is-active', a.dataset.id === mod.id));
      B.$('#pageTitle').textContent = mod.title;
      B.$('#pageSub').textContent = mod.sub;
      document.title = `${mod.title} · Business OS`;
      const root = B.$('#view');
      root.innerHTML = '';
      mod.render(root);
      if (!isRefresh) { window.scrollTo({ top: 0 }); B.closeSidebar(); }
    }
  };

  B.openSidebar = () => { B.$('#sidebar').classList.add('is-open'); B.$('#scrim').classList.add('is-visible'); };
  B.closeSidebar = () => { B.$('#sidebar').classList.remove('is-open'); B.$('#scrim').classList.remove('is-visible'); };
})(window.BOS);

</script>
<script>
/* Dashboard: revenue, profit and cash flow side by side, plus stock alerts and recent sales. */
(function (B) {
  'use strict';
  const { esc, fmt, finance: F } = B;
  const PALETTE = ['#0f766e', '#d9573b', '#3b4bd8', '#e0a526', '#7a5af8', '#2ba3c4', '#8a9490'];
  let charts = [];
  let months = 3;

  const delta = (pct, extra = '') => pct === null
    ? `<p class="kpi-delta">No earlier period to compare</p>`
    : `<p class="kpi-delta ${pct >= 0 ? 'is-good' : 'is-bad'}">${pct >= 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)}% vs previous period</p>${extra}`;

  const kpi = (label, value, caption, footer) =>
    `<article class="card kpi"><p class="kpi-label">${label}</p><p class="kpi-value">${value}</p><p class="kpi-caption">${caption}</p>${footer}</article>`;

  function stockRow(p) {
    const out = p.qty === 0;
    return `<li class="row"><div><p class="row-title">${esc(p.name)}</p><p class="row-sub">${fmt.num(p.qty)} left · reorder at ${fmt.num(p.reorderLevel)}</p></div>
      <span class="tag ${out ? 'tag-bad' : 'tag-warn'}">${out ? 'Out of stock' : 'Low stock'}</span></li>`;
  }

  function render(root) {
    const st = B.store.state, r = F.range(months);
    const cur = F.summary(st, r.from, r.to), prev = F.summary(st, r.prevFrom, r.prevTo);
    const low = F.lowStock(st), top = F.topProducts(st, r.from, r.to, 5);
    const recent = [...st.sales].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, 6);
    const customer = id => (st.customers.find(c => c.id === id) || { name: 'Unknown customer' }).name;
    const marginDiff = prev.revenue ? cur.margin - prev.margin : null;

    const marginFooter = marginDiff === null ? delta(null)
      : `<p class="kpi-delta ${marginDiff >= 0 ? 'is-good' : 'is-bad'}">${marginDiff >= 0 ? '▲' : '▼'} ${Math.abs(marginDiff).toFixed(1)} pts vs previous period</p>`;
    const cashFooter = delta(F.change(cur.cashFlow, prev.cashFlow),
      `<p class="kpi-caption">In ${fmt.money(cur.cashIn)} · Out ${fmt.money(cur.cashOut)}<br>Not yet collected: ${fmt.money(cur.receivables)}</p>`);

    root.innerHTML = `
      <div class="view-tools">
        <label><span class="sr-only">Reporting period</span>
          <select id="periodSelect">
            ${[[1, 'This month'], [3, 'Last 3 months'], [6, 'Last 6 months'], [12, 'Last 12 months']]
              .map(([v, l]) => `<option value="${v}" ${v === months ? 'selected' : ''}>${l}</option>`).join('')}
          </select></label>
      </div>

      <section class="grid-kpi" aria-label="Key figures">
        ${kpi('Total Revenue', fmt.money(cur.revenue), 'Sales made, paid or not', delta(F.change(cur.revenue, prev.revenue)))}
        ${kpi('Gross Profit', fmt.money(cur.grossProfit), 'Revenue − cost of goods sold', delta(F.change(cur.grossProfit, prev.grossProfit)))}
        ${kpi('Net Profit', fmt.money(cur.netProfit), 'Revenue − all expenses, incl. goods sold', delta(F.change(cur.netProfit, prev.netProfit)))}
        ${kpi('Profit Margin', fmt.pct(cur.margin), 'Net profit ÷ revenue', marginFooter)}
        ${kpi('Cash Flow', fmt.money(cur.cashFlow), 'Cash received − cash paid out', cashFooter)}
        ${kpi('Inventory Value', fmt.money(F.inventoryValue(st)), 'Quantity × purchase price, today',
          `<p class="kpi-delta ${low.length ? 'is-bad' : 'is-good'}">${low.length ? `${low.length} product${low.length > 1 ? 's' : ''} need restocking` : 'All stock above reorder level'}</p>`)}
      </section>

      <section class="grid-main">
        <article class="card">
          <div class="card-head"><h2>Revenue, Expenses and Net Profit</h2><p class="card-sub">By month, last 12 months</p></div>
          <div class="chart-box"><canvas id="trendChart" role="img" aria-label="Monthly revenue, expenses and net profit"></canvas></div>
        </article>
        <article class="card">
          <div class="card-head"><h2>Where the money goes</h2><p class="card-sub">Total expenses in the period</p></div>
          <div class="chart-box"><canvas id="costChart" role="img" aria-label="Expense breakdown"></canvas></div>
        </article>
      </section>

      <section class="grid-three">
        <article class="card">
          <div class="card-head"><h2>Restock soon</h2><p class="card-sub">At or below reorder level</p></div>
          ${low.length ? `<ul class="row-list">${low.slice(0, 5).map(stockRow).join('')}</ul>${low.length > 5 ? `<p class="row-sub">+${low.length - 5} more</p>` : ''}`
            : `<p class="empty-inline">Nothing to restock. Every product is above its reorder level.</p>`}
        </article>
        <article class="card">
          <div class="card-head"><h2>Fastest selling</h2><p class="card-sub">Units sold in the period</p></div>
          ${top.length ? `<ul class="row-list">${top.map(t => `<li class="row"><div><p class="row-title">${esc(t.name)}</p><p class="row-sub">${fmt.num(t.units)} units</p></div><p class="row-value">${fmt.money(t.revenue)}</p></li>`).join('')}</ul>`
            : `<p class="empty-inline">No sales in this period yet.</p>`}
        </article>
        <article class="card">
          <div class="card-head"><h2>Recent sales</h2><p class="card-sub">Latest five orders</p></div>
          ${recent.length ? `<ul class="row-list">${recent.slice(0, 5).map(s => `<li class="row"><div><p class="row-title">${esc(customer(s.customerId))}</p><p class="row-sub">${s.id} · ${fmt.date(s.date)}</p></div>
              <div><p class="row-value">${fmt.money(F.saleTotal(s))}</p><span class="tag ${s.status === 'paid' ? 'tag-good' : 'tag-warn'}">${s.status === 'paid' ? 'Paid' : 'Unpaid'}</span></div></li>`).join('')}</ul>`
            : `<p class="empty-inline">No sales recorded yet.</p>`}
        </article>
      </section>`;

    B.$('#periodSelect').addEventListener('change', e => { months = Number(e.target.value); B.router.show(mod, true); });
    drawCharts(st, F.costBreakdown(st, r.from, r.to));
  }

  function drawCharts(st, costs) {
    B.chartDefaults();
    const rows = F.monthly(st, 12);
    const money = c => ` ${c.dataset.label || c.label}: ${fmt.money(c.parsed.y ?? c.parsed)}`;
    const tooltip = { backgroundColor: '#10201e', padding: 10, cornerRadius: 8, callbacks: { label: money } };

    charts.push(new Chart(B.$('#trendChart'), {
      data: {
        labels: rows.map(r => r.label),
        datasets: [
          { type: 'bar', label: 'Net profit', data: rows.map(r => r.netProfit), backgroundColor: rows.map(r => (r.netProfit >= 0 ? B.css('--brand') : B.css('--bad'))), borderRadius: 5, maxBarThickness: 22, order: 2 },
          { type: 'line', label: 'Revenue', data: rows.map(r => r.revenue), borderColor: '#3b4bd8', tension: .35, pointRadius: 0, borderWidth: 2.5, order: 1 },
          { type: 'line', label: 'Total expenses', data: rows.map(r => r.totalExpenses), borderColor: '#e0a526', tension: .35, pointRadius: 0, borderWidth: 2.5, order: 1 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { align: 'end', labels: { usePointStyle: true, boxWidth: 8, boxHeight: 8 } }, tooltip },
        scales: { x: { grid: { display: false }, border: { display: false } }, y: { border: { display: false }, grid: { color: B.css('--line') }, ticks: { callback: v => fmt.compact(v), maxTicksLimit: 6 } } }
      }
    }));

    const top = costs.slice(0, 6), rest = costs.slice(6).reduce((s, [, v]) => s + v, 0);
    if (rest > 0) top.push(['Other', rest]);
    charts.push(new Chart(B.$('#costChart'), {
      type: 'doughnut',
      data: { labels: top.length ? top.map(c => c[0]) : ['No expenses'], datasets: [{ data: top.length ? top.map(c => c[1]) : [1], backgroundColor: top.length ? PALETTE : [B.css('--line')], borderWidth: 2, borderColor: B.css('--card') }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '64%', plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, boxHeight: 8, padding: 10 } }, tooltip } }
    }));
  }

  const mod = {
    id: 'dashboard', title: 'Dashboard', sub: 'Your business at a glance', icon: 'dashboard', group: 'Overview',
    render, destroy() { charts.forEach(c => c.destroy()); charts = []; }
  };
  B.register(mod);
})(window.BOS);

</script>
